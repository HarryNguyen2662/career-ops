  - heading "Backend Engineer, Core Technology" [level=1] [ref=e45]
  - generic [ref=e53]:
    - generic [ref=e54]:
      - generic [ref=e55]:
        - heading "Who we are" [level=2] [ref=e56]
        - heading "About Stripe" [level=3] [ref=e57]
        - paragraph [ref=e58]: Stripe is a financial infrastructure platform for businesses. Millions of companies—from the world’s largest enterprises to the most ambitious startups—use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone’s reach while doing the most important work of your career.
        - heading "About the organization" [level=3] [ref=e59]
        - paragraph [ref=e60]: Stripe Infrastructure is responsible for the reliability, scale, performance, and cost of Stripe’s systems and the productivity and sentiment of Stripe’s people.
        - paragraph [ref=e61]: "You may work on a wide variety of critical business areas including:"
        - list [ref=e62]:
          - listitem [ref=e63]: Core Infrastructure - We’re the home for Stripe's critical tier0 infrastructure systems (Compute, Networking, DocumentDB, Distributed Caching and High assurance engineering). We build the foundational platform for Stripe products and services to allow them to operate at scale. We drive reliability, availability, efficiency and scalability of these systems.
          - listitem [ref=e64]: Developer Infrastructure - We’re responsible for the productivity of all developers at Stripe. Ensure Stripe’s engineers have a reliable, fast, and easy-to-use inner dev loop to maximize productivity while building everything from low-latency microservices to large-scale data pipelines and machine learning models
          - listitem [ref=e65]: Data Infrastructure - We’re responsible for offering data serving infrastructure spanning across data warehouse analytics, streaming analytics and search capabilities. The stack is supported by a collection of internally developed large scale distributed services and several popular open source technologies like Trino/Presto, Apache Pinot, Hive Metastore, ElasticSearch etc. The systems we own support all of the data serving needs of high scale services and thousands of individual Stripes across the company.
          - listitem [ref=e66]: Admin Platform - We empower Stripes to quickly build secure and delightful internal products in service of their users.
          - listitem [ref=e67]: Service Platform - We enable engineering teams at Stripe to easily write and ship useful services that correctly, reliably, and efficiently leverage platform capabilities.
          - listitem [ref=e68]: Developer Productivity AI - We're responsible for doubling Stripe's engineering velocity through effective use of LLMs. We own Minions, Stripe’s one-shot, end-to-end coding agents.
        - paragraph [ref=e69]:
          - text: "Team Matching: exact team matching for one of the subteams will begin during final stages. Please note we may also consider you for different orgs based on your experience, location, etc. More information on our team matching process can be found"
          - link "here" [ref=e70] [cursor=pointer]:
            - /url: https://docs.google.com/document/d/1zvJkO2c7GzukHG-_oqc5wbOLajpuh5FjbmZPcZPU1o0/edit?tab=t.0#heading=h.ahb3b6nrktv1
          - text: .
        - heading "What you’ll do" [level=3] [ref=e71]
        - paragraph [ref=e72]: You will work on projects that span technologies, systems, and processes where you will design, build, test, and ship great code every day.
        - paragraph [ref=e73]: Responsibilities
        - list [ref=e74]:
          - listitem [ref=e75]: Build a great customer experience for internal and external Stripe teams using our infrastructure
          - listitem [ref=e76]: Participate in roadmap planning and prioritization
          - listitem [ref=e77]: Deliver value through a strong collaborative approach with multiple customers and stakeholders across Stripe
          - listitem [ref=e78]: Debug production issues across services and several levels of the stack
        - heading "Who you are" [level=3] [ref=e79]
        - paragraph [ref=e80]: We’re looking for someone who meets the minimum requirements to be considered for the role. If you meet these requirements, you are encouraged to apply. The preferred qualifications are a bonus, not a requirement.
        - heading "Minimum Requirements" [level=3] [ref=e81]
        - list [ref=e82]:
          - listitem [ref=e83]: Strong software engineering skills and a passion for one of the areas above.
          - listitem [ref=e84]: Ability to write high quality code (in programming languages like Go, Java, C/C++ etc)
          - listitem [ref=e85]: 2-12+ years of professional hands-on software development experience, able to write well-factored algorithms and have experience with commonly used data structure and algorithms
          - listitem [ref=e86]: Hands-on experience contributing to or building large scale distributed systems
          - listitem [ref=e87]: Strong collaboration skills, can work across workstreams within your team and contribute to your peers’ success
          - listitem [ref=e88]: Customer obsession, ability to articulate and represent customer experience in various forums to drive the right outcome
          - listitem [ref=e89]: Have the ability to thrive on a high level of autonomy, responsibility, and think of yourself as entrepreneurial
        - heading "Preferred Qualifications" [level=3] [ref=e90]
        - list [ref=e91]:
          - listitem [ref=e92]: Experience optimizing the end to end performance of distributed systems
          - listitem [ref=e93]: Focuses on the needs of our users, both internal and external
          - listitem [ref=e94]: Hold yourself and others to a high bar when working with production
      - generic [ref=e95]:
        - generic [ref=e96]:
          - heading "Hybrid work at Stripe" [level=1] [ref=e98]
          - paragraph [ref=e100]: This role is available either in an office or a remote location (35+ miles or 56+ km from a Stripe office).
        - generic [ref=e101]:
          - heading "In-office expectations" [level=1] [ref=e103]
          - generic [ref=e104]: Office-assigned Stripes spend at least 50% of the time in a given month in their local office or with users. This hits a balance between bringing people together for in-person collaboration and learning from each other, while supporting flexibility about how to do this in a way that makes sense for individuals and their teams.
        - generic [ref=e105]:
          - heading "Working remotely at Stripe" [level=1] [ref=e107]
          - generic [ref=e108]: A remote location is defined as being 35 miles (56 kilometers) or more from one of our offices. While you would be welcome to come into the office for team/business meetings, on-sites, meet-ups, and events, our expectation is you would regularly work from home rather than a Stripe office. Stripe does not cover the cost of relocating to a remote location. We encourage you to apply for roles that match the location where you currently live or plan to live.
      - generic [ref=e109]:
        - heading "Pay and benefits" [level=1] [ref=e111]
        - generic [ref=e112]:
          - paragraph [ref=e113]: The annual US base salary range for this role is $173,000 - $259,600. For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role. This salary range may be inclusive of several career levels at Stripe and will be narrowed during the interview process based on a number of factors, including the candidate’s experience, qualifications, and location. Applicants interested in this role and who are not located in the US may request the annual salary range for their location during the interview process.
          - paragraph [ref=e114]: "Additional benefits for this role may include: equity, company bonus or sales commissions/bonuses; 401(k) plan; medical, dental, and vision benefits; and wellness stipends."
