        - strong [ref=e32]: A World-Changing Company
        - generic [ref=e34]: Palantir builds the world’s leading software for data-driven decisions and operations. By bringing the right data to the people who need it, our platforms empower our partners to develop lifesaving drugs, forecast supply chain disruptions, locate missing children, and more.
        - strong [ref=e37]: The Role
        - generic [ref=e39]: Are you passionate about engineering quality, performance, and increasing the impact of engineers around you?
        - generic [ref=e41]: Software Engineers at Palantir build software at scale to transform how organizations around the world use data. As an intern within Palantir’s Foundations organization, you’ll have the opportunity to grow more quickly than you ever imagined, as you build the shared infrastructure that underpins the Palantir Foundry, Palantir Gotham, and Palantir Apollo platforms, and drive investments to improve the velocity and quality of our engineering.
        - generic [ref=e43]: "Teams within Palantir’s Foundations organization are made up of a small number of engineers, each focused on one of four major categories of our infrastructure:"
        - generic [ref=e45]:
          - text: •
          - strong [ref=e46]: "Backend Infrastructure:"
          - text: "Maximizes the productivity of our backend developers and ensures Palantir’s platforms have performant and consistent RESTful services. Think: making the “easy way” the “right way” when developing backend services, including designing infrastructure to build hundreds of micro-service repos performantly, or to ensure we keep reliable audit logs of everything users do in our platforms."
        - generic [ref=e47]:
          - text: •
          - strong [ref=e48]: "Developer Infrastructure:"
          - text: Operates the systems and services that underpin all aspects of our developer ecosystem, including off-the-shelf tooling like GitHub and custom tooling for managing automated changes across hundreds of repositories.
        - generic [ref=e49]:
          - text: •
          - strong [ref=e50]: "Frontend Infrastructure:"
          - text: "Maximizes frontend developer productivity across the entire frontend development stack, from the developer experience in the IDE to the final user experience in the browser. Think: the core infrastructure required to develop and serve our frontends (including features flags, internationalization, and commit previews), performant build tooling for millions of lines of TypeScript, and the Blueprint"
          - link "open source UI framework" [ref=e51] [cursor=pointer]:
            - /url: https://blueprintjs.com/
          - text: .
        - generic [ref=e52]:
          - text: •
          - strong [ref=e53]: "Storage Infrastructure:"
          - text: Develops Palantir’s database and search systems, which includes supporting storage technologies across cloud, on-premise, and classified or secure environments. This includes evolving our existing technologies to support ever-increasing data scale and latency requirements, and designing the next evolution of our database offering to provide step-change improvements in particular workflows.
        - strong [ref=e56]: Core Responsibilities
        - generic [ref=e58]: As a Software Engineering Intern in Foundations, your projects may include building features to improve the developer experience for other Palantir engineers, or improving the scalability and reliability of Palantir’s platforms.
        - generic [ref=e60]: You’ll be involved throughout the product lifecycle, from idea generation and design, to execution and rollout, all while being paired with a mentor dedicated to your growth and success. You'll collaborate closely with technical and non-technical counterparts to understand our developers' and customers' problems and build infrastructure to tackle them.
        - strong [ref=e63]: Technologies We Use
        - generic [ref=e65]: "It doesn’t matter what languages you know when you join us, but it does matter that you can write clean, effective code and learn new languages quickly. Our software is constantly evolving, so we need engineers who can do the same. Alongside peers that bring diverse experience - whether you’re a former university TA, switched to CS recently, or are a hackathon enthusiast — you'll build your skills to apply the best technology to solve a given problem. Right now, we use:"
        - generic [ref=e67]: • Varying languages, including Java and Go for backend and TypeScript for frontend
        - generic [ref=e68]: • Open-source technologies like Cassandra, Spark, Elasticsearch, React, and Redux
        - generic [ref=e69]: • Industry-standard build tooling, including Gradle, CircleCI, and GitHub
