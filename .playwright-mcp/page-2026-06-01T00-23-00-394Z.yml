              - generic [ref=e166]:
                - paragraph
                - heading "The opportunity" [level=3] [ref=e533]
                - text: Our Gamer AI team develops conversion rate prediction and market price models that power our ad ranking and recommendation systems. By leveraging large-scale data and contextual signals, we continuously enhance prediction relevance and accuracy. This drives outcomes such as higher user engagement, stronger conversion performance, and better return on ad spend, helping advertisers achieve their goals while delivering a more engaging experience for users.
                - paragraph
                - paragraph [ref=e534]: We are seeking a motivated Machine Learning Engineer to support the development and maintenance of systems for understanding user behavior across applications. You will contribute to improving ad ranking, conversion predictions, and recommendation systems, working alongside experienced engineers to build behavioral models and optimize ad performance.
                - paragraph
                - heading "What you'll be doing" [level=3] [ref=e535]
                - paragraph
                - list [ref=e536]:
                  - listitem [ref=e537]: Design, implement, and optimize user behavior models that directly influence ad ranking, bidding, and conversion outcomes across billions of impressions.
                  - listitem [ref=e538]: Monitor model performance and help identify data quality issues or model degradation.
                  - listitem [ref=e539]: Write clean, maintainable code and participate in code reviews to improve your craft.
                  - listitem [ref=e540]: Learn and communicate how our models work to cross-functional partners.
                - paragraph
                - heading "What we're looking for" [level=3] [ref=e541]
                - paragraph
                - list [ref=e542]:
                  - listitem [ref=e543]: BS in Computer Science, Machine Learning, Statistics, or related field.
                  - listitem [ref=e544]: Strong foundation in Python or similar programming languages.
                  - listitem [ref=e545]: Familiarity with machine learning fundamentals and statistical analysis.
                  - listitem [ref=e546]: Curiosity about how ads, recommendations, and user behavior work at scale.
                  - listitem [ref=e547]: Hungry to grow through rapid iteration, experimenting with real signals and learning what works at scale.
                - paragraph
                - heading "You might also have" [level=3] [ref=e548]
                - paragraph
                - list [ref=e549]:
                  - listitem [ref=e550]: First experience, publications, or academic projects in the ads domain or recommendation systems.
                  - listitem [ref=e551]: Exposure to experimentation and A/B testing frameworks.
                  - listitem [ref=e552]: Experience using AI tools like Claude Code or GitHub Copilot to learn and build faster.
                - paragraph
                - heading "Additional information" [level=3] [ref=e553]
                - paragraph
                - list [ref=e554]:
                  - listitem [ref=e555]: Relocation support is not available for this position
                  - listitem [ref=e556]: Work visa/immigration sponsorship is not available for this position
                - paragraph
                - heading "Benefits" [level=3] [ref=e557]
                - text: At Unity, we want our team members to thrive. We offer a wide range of benefits designed to support well-being and work-life balance.
                - paragraph
                - paragraph [ref=e558]: "Please note: Benefits eligibility, specific offerings, and coverage vary based on the country and employment status."
                - paragraph [ref=e559]: "While specific benefits vary, here are some of the ways we strive to take care of our eligible team members globally: Comprehensive health, life, and disability insurance | Commute subsidy | Employee stock ownership | Competitive retirement/pension plans | Generous vacation and personal days | Support for new parents through leave and family-care programs | Office food snacks | Mental Health and Wellbeing programs and support | Employee Resource Groups | Global Employee Assistance Program | Training and development programs | Volunteering and donation matching program"
                - paragraph
                - heading "Life at Unity" [level=3] [ref=e560]
                - text: "Unity [NYSE: U] is the world’s leading game engine, powering play for more than 3 billion consumers each month. The top mobile games in the world, the most played PC indie titles, the most innovative console games, and virtually all of the top XR and Web Games are developed, deployed, and grown in Unity. Unity also enables teams across industries like automotive, manufacturing, and healthcare to design, simulate, and collaborate in 3D — closing the gap between ideas and reality. For more information, please visit www.unity.com."
                - paragraph
                - paragraph [ref=e561]:
                  - emphasis [ref=e562]:
                    - text: Unity is a proud equal opportunity employer. We are committed to fostering an inclusive, innovative environment and celebrate our employees across age, race, color, ancestry, national origin, religion, disability, sex, gender identity or expression, sexual orientation, or any other protected status in accordance with applicable law. Our differences are strengths that enable us to support the growing and evolving needs of our customers, partners, and collaborators. If you have a disability that means there are preparations or accommodations we can make to help ensure you have a comfortable and positive interview experience, please fill out
                    - link "this form" [ref=e563] [cursor=pointer]:
                      - /url: https://docs.google.com/forms/d/e/1FAIpQLSdrbRLG1N-apH1eahQ622Gypo-rmiAB6LLTP1UsSWQNu7omxQ/viewform
                    - text: to let us know.
                - paragraph [ref=e564]:
                  - emphasis [ref=e565]: This position requires the incumbent to have a sufficient knowledge of English to have professional verbal and written exchanges in this language since the performance of the duties related to this position requires frequent and regular communication with colleagues and partners located worldwide and whose common language is English.
                - paragraph [ref=e566]:
                  - emphasis [ref=e567]: Headhunters and recruitment agencies may not submit resumes/CVs through this website or directly to managers. Unity does not accept unsolicited headhunter and agency resumes. Unity will not pay fees to any third-party agency or company that does not have a signed agreement with Unity.
                - paragraph [ref=e568]:
                  - emphasis [ref=e569]:
                    - text: Your privacy is important to us. Please take a moment to review our
