      - generic [ref=e15]:
        - heading "About the Program" [level=3] [ref=e16]
        - paragraph [ref=e17]: Our goal is to give you a real sense of what it’s like to work at Jane Street full time. Over the course of your internship, you will explore ways to approach and solve exciting problems within your field of interest through fun and challenging classes, interactive sessions, and group discussions — and then you will have the chance to put those lessons to practical use.
        - paragraph [ref=e18]: As an intern, you are paired with full-time employees who act as mentors, collaborating with you on real-world projects we actually need done. When you’re not working on your project, you will have plenty of time to use our office amenities, physical and virtual educational resources, attend guest speakers and social events, and engage with the parts of our work that excite you the most.
        - paragraph [ref=e19]: If you’ve never thought about a career in finance, you’re in good company. Many of us were in the same position before working here. If you have a curious mind, a collaborative spirit, and a passion for solving interesting problems, we have a feeling you’ll fit right in.
        - paragraph [ref=e20]:
          - text: Learn more about Jane Street’s
          - link "internship program" [ref=e21] [cursor=pointer]:
            - /url: https://www.janestreet.com/join-jane-street/internships/
          - text: here.
        - heading "About the Position" [level=3] [ref=e22]
        - paragraph [ref=e23]: As a Software Engineering intern, you’ll learn how we use OCaml (our primary development language) in our day to day work, and gain exposure to the libraries and tools that are foundational to our internal systems. Some teams also use Python, so depending on the project, you might do some work with Python as well.
        - paragraph [ref=e24]: During the internship, you'll be closely mentored by full-time software engineers. Mentors design intern projects based on their team's current needs and are heavily invested in helping interns build maintainable, high-quality software that is intended to reach production. The projects you will work on are as varied and diverse as those full-timers work on, covering a wide range of problems, from high performance trading systems to programming language design and everything in between.
        - paragraph [ref=e25]:
          - text: If you’d like to learn more, you can read about our
          - link "interview" [ref=e26] [cursor=pointer]:
            - /url: https://www.janestreet.com/preparing-for-a-software-engineering-interview/
          - text: and
          - link "team placement" [ref=e27] [cursor=pointer]:
            - /url: https://blog.janestreet.com/project-pairing/#fn:1
          - text: processes and get a sense of what our
          - link "most recent intern projects" [ref=e28] [cursor=pointer]:
            - /url: https://blog.janestreet.com/tag/internship/
          - text: looked like!
        - heading "About You" [level=3] [ref=e29]
        - paragraph [ref=e30]:
          - text: We
          - emphasis [ref=e31]: don’t
          - text: "expect you to have a background in finance, OCaml, functional programming, or any other specific field—we’re looking for smart people who enjoy solving interesting problems. We’re more interested in how you think and learn than what you currently know. You should be:"
        - list [ref=e32]:
          - listitem [ref=e33]: A top-notch programmer with a love for technology
          - listitem [ref=e34]: Intellectually curious, collaborative, and eager to learn
          - listitem [ref=e35]: Humble and unafraid to ask questions and admit mistakes
          - listitem [ref=e36]: Must be enrolled in a co-op program at your university
        - paragraph [ref=e37]:
          - emphasis [ref=e38]: If you're a recruiting agency and want to partner with us, please reach out to agency-partnerships@janestreet.com.
