        - generic [ref=e20]:
          - generic [ref=e21]:
            - heading "About the role" [level=2] [ref=e22]:
              - strong [ref=e23]: About the role
            - paragraph [ref=e24]: Chime’s Machine Learning Platform (MLP) team builds and operates the infrastructure, tooling, and developer experience that powers machine learning across the company. We enable data scientists and ML engineers to develop, train, deploy, and monitor models reliably and efficiently.
            - paragraph [ref=e25]: As a Machine Learning Platform Engineer, you will design and build scalable systems that support model training, feature computation, real-time inference, and experimentation. You’ll work at the intersection of distributed systems, cloud infrastructure, and applied machine learning.
            - paragraph [ref=e26]: This role focuses on building robust foundations that allow ML teams to move quickly while maintaining reliability, governance, and cost efficiency.
            - paragraph [ref=e27]: The base salary offered for this role and level of experience will begin at $187,000.00 and goes up to $259,000.00. Full-time employees are also eligible for a bonus, competitive equity package, and benefits. The actual base salary offered may be higher, depending on your location, skills, qualifications, and experience.
            - heading "In this role, you can expect to" [level=2] [ref=e28]
            - list [ref=e29]:
              - listitem [ref=e30]: Design, build, and operate scalable ML infrastructure on AWS
              - listitem [ref=e31]: Develop distributed training and batch processing systems using Ray
              - listitem [ref=e32]: Build and maintain infrastructure-as-code using Terraform
              - listitem [ref=e33]: Support and evolve the feature store and feature pipelines
              - listitem [ref=e34]: Develop data ingestion and streaming systems (e.g., Kinesis, Kafka, Flink, Spark, or similar technologies)
              - listitem [ref=e35]: Improve CI/CD workflows for ML models and platform components
              - listitem [ref=e36]: Enhance observability, reliability, and cost visibility across ML workloads
              - listitem [ref=e37]: Partner closely with Data Science and ML Engineering teams to improve developer experience
              - listitem [ref=e38]: Contribute to platform architecture decisions and technical roadmaps
              - listitem [ref=e39]: Participate in on-call rotations to support production systems
            - heading "To thrive in this role, you have" [level=2] [ref=e40]
            - list [ref=e41]:
              - listitem [ref=e42]: 5+ years of experience in ML infrastructure, platform engineering, or production ML systems
              - listitem [ref=e43]: Knowledge of the machine learning model development lifecycle, including data preprocessing, model training, evaluation, and deployment
              - listitem [ref=e44]: Experience with distributed systems, cloud computing, or large-scale data processing
              - listitem [ref=e45]: Strong foundation in computer science and software engineering principles
              - listitem [ref=e46]: Deeply interested in the impact and evolution of advanced AI technologies
              - listitem [ref=e47]: Hands-on experience with CI/CD pipelines, DevOps practices, and infrastructure as code
              - listitem [ref=e48]: Experience with containerization technologies such as Docker and Kubernetes, and orchestration systems
              - listitem [ref=e49]: Knowledge of cloud platforms such as AWS and distributed computing frameworks such as Spark and Ray
              - listitem [ref=e50]: Experience with GPU programming(CUDA) and GPU costs/optimization
              - listitem [ref=e51]: Strong programming skills in Python, Go, Scala, Java or similar languages
              - listitem [ref=e52]: Familiarity with infrastructure-as-code (e.g., Terraform, CloudFormation)
              - listitem [ref=e53]: Solid understanding of software engineering fundamentals (testing, version control, code review, observability)
            - heading "Nice-to-have" [level=2] [ref=e54]
            - list [ref=e55]:
              - listitem [ref=e56]: Experience with distributed compute frameworks such as Ray
              - listitem [ref=e57]: Experience building or operating a feature store
              - listitem [ref=e58]: Experience with real-time ML systems or model serving
              - listitem [ref=e59]: Familiarity with streaming technologies (Kafka, Kinesis, Flink, Spark Streaming, etc.)
              - listitem [ref=e60]: Experience supporting ML lifecycle workflows (training, evaluation, deployment, monitoring)
              - listitem [ref=e61]: Knowledge of ML experimentation platforms and model governance practices
            - paragraph [ref=e62]: "#LI-GC1 #LI-SF"
          - generic [ref=e63]:
            - heading "A little about us" [level=2] [ref=e64]:
              - strong [ref=e66]: A little about us
            - paragraph [ref=e67]: At Chime, we believe that everyone can achieve financial progress. We created Chime—a financial technology company, not a bank*—on the premise that core banking services should be helpful, easy, and free. Through our user-friendly tools and intuitive platforms, we empower our members to take control of their finances and work towards their goals. Whether it's starting a savings account, purchasing a first car or home, launching a business, or pursuing higher education, we're proud to have helped millions unlock their financial potential.
            - paragraph [ref=e68]: "We're a team of problem solvers, dreamers, and builders with one shared obsession: our members. From day one, Chimers have worked tirelessly to out-hustle and out-execute competitors to bring our mission to life. Their grit and determination inspire us to work harder every day to deliver the very best experience possible. We each bring an owner's mindset to our work, refusing to be outdone and holding ourselves accountable to meet and exceed the highest bars for our teams, our company, and our members."
            - paragraph [ref=e69]: We believe in being bold, dreaming big, and taking risks, while also working together, embracing our diverse perspectives, and giving each other honest feedback. Our culture remains deeply entrepreneurial, encouraging every Chimer to see themselves as stewards of our mission to help everyday Americans unlock their financial progress.
            - paragraph [ref=e70]: We know that to achieve our mission, we must earn and keep people's trust—so we hold ourselves to the highest standards of integrity in everything we do. These aren't just words on a wall—our values are embedded in every aspect of our business, serving as a north star that guides us as we work to help millions achieve their financial potential.
            - paragraph [ref=e71]: Because if we don't—who will?
            - paragraph [ref=e72]: "*Chime is a financial technology company, not a bank. Banking services provided by The Bancorp Bank, N.A. or Stride Bank, N.A., Members FDIC."
            - heading "What we offer for our full-time, regular employees" [level=2] [ref=e73]:
              - strong [ref=e75]: What we offer for our full-time, regular employees
            - list [ref=e76]:
              - listitem [ref=e77]: 🏢 Our in-office work policy is designed to keep you connected - with four days a week in the office and Fridays from home for those near one of our offices, plus team and company-wide events depending on location. Whether you’re coming in regularly or are part of our fully remote program, you’ll stay engaged with your work and teammates.
              - listitem [ref=e78]: 💻 In-office perks including backup child, elder, and/or pet care, plus a subsidized commuter benefit to support your regular commute
              - listitem [ref=e79]: 💰 Competitive salary based on experience
              - listitem [ref=e80]: ✨ 401k match plus great medical, dental, vision, life, and disability benefits
              - listitem [ref=e81]: 🏝 Generous vacation policy and company-wide Chime Days, bonus company-wide paid days off
              - listitem [ref=e82]: 🫂 1% of your time off to support local community organizations of your choice
              - listitem [ref=e83]: 👟 Annual wellness stipend to use towards eligible wellness related expenses
              - listitem [ref=e84]: 👶 Up to 24 weeks of paid parental leave for birthing parents and 12 weeks of paid parental leave for non-birthing parents
              - listitem [ref=e85]: 👪 Access to Maven, a family planning tool, with $15k lifetime reimbursement for egg freezing, fertility treatments, adoption, and more.
              - listitem [ref=e86]: 🎉 In-person and virtual events to connect with your fellow Chimers—think cooking classes, guided meditations, music festivals, mixology classes, paint nights, etc., and delicious snack boxes, too!
              - listitem [ref=e87]: 💚 A challenging and fulfilling opportunity to join one of the most experienced teams in FinTech and help millions unlock financial progress
            - paragraph [ref=e88]: We know that great work can’t be done without a diverse team and inclusive environment. That’s why we specifically look for individuals of varying strengths, skills, backgrounds, and ideas to join our team. We believe this gives us a competitive advantage to better serve our members and helps us all grow as Chimers and individuals.
            - paragraph [ref=e89]:
              - generic [ref=e90]:
                - text: "Chime is proud to be an Equal Opportunity Employer. We consider qualified applicants without regard to race, color, ancestry, religion, sex, national origin, sexual orientation, gender identity, age, marital or family status, disability, genetic information, veteran status, or any other legally protected basis under provincial, federal, state, and local laws, regulations, or ordinances. We will also consider qualified applicants with criminal histories in a manner consistent with the requirements of state and local laws, including the San Francisco Fair Chance Ordinance, Cook County Ordinance, NYC Fair Chance Act, and the LA City Fair Chance Ordinance, and consistent with Canadian provincial and federal laws. If you have a disability or special need that requires accommodation during any stage of the application process, please contact:"
                - link "benefits@chime.com" [ref=e92] [cursor=pointer]:
                  - /url: mailto:benefits@chime.com
                - text: .
            - paragraph [ref=e93]:
