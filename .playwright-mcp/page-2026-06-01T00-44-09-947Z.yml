            - paragraph [ref=e88]:
              - text: Please note that we welcome interest from candidates with varying levels of experience; many successful candidates do not meet every single requirement. Additionally, studies have shown that people from
              - link "underrepresented groups" [ref=e89] [cursor=pointer]:
                - /url: https://about.gitlab.com/company/culture/inclusion/#examples-of-select-underrepresented-groups
              - text: are less likely to apply to a job unless they meet every single qualification. If you're excited about this role, please apply and allow our recruiters to assess your application.
            - separator [ref=e90]
            - paragraph [ref=e91]:
              - strong [ref=e92]: "Country Hiring Guidelines:"
              - text: GitLab hires new team members in countries around the world. All of our roles are remote, however some roles may carry specific location-based eligibility requirements. Our Talent Acquisition team can help answer any questions about location after starting the recruiting process.
            - paragraph [ref=e93]:
              - strong [ref=e94]: "Privacy Policy:"
              - text: Please review our
              - link "Recruitment Privacy Policy." [ref=e95] [cursor=pointer]:
                - /url: https://handbook.gitlab.com/handbook/hiring/candidate-faq/recruitment-privacy-policy/
              - text: Your privacy is important to us.
            - paragraph [ref=e96]:
              - text: GitLab is proud to be an equal opportunity workplace and is an affirmative action employer. GitLab’s policies and practices relating to recruitment, employment, career development and advancement, promotion, and retirement are based solely on merit, regardless of race, color, religion, ancestry, sex (including pregnancy, lactation, sexual orientation, gender identity, or gender expression), national origin, age, citizenship, marital status, mental or physical disability, genetic information (including family medical history), discharge status from the military, protected veteran status (which includes disabled veterans, recently separated veterans, active duty wartime or campaign badge veterans, and Armed Forces service medal veterans), or any other basis protected by law. GitLab will not tolerate discrimination or harassment based on any of these characteristics. See also
              - link "GitLab’s EEO Policy" [ref=e97] [cursor=pointer]:
                - /url: https://about.gitlab.com/handbook/people-policies/inc-usa/#equal-employment-opportunity-policy
              - text: and
              - link "EEO is the Law" [ref=e98] [cursor=pointer]:
                - /url: https://about.gitlab.com/handbook/labor-and-employment-notices/#eeoc-us-equal-employment-opportunity-commission-notices
              - text: . If you have a disability or special need that requires
              - link "accommodation" [ref=e99] [cursor=pointer]:
                - /url: https://about.gitlab.com/handbook/people-policies/inc-usa/#reasonable-accommodation
              - text: ", please let us know during the"
              - link "recruiting process" [ref=e100] [cursor=pointer]:
                - /url: https://about.gitlab.com/handbook/hiring/interviewing/#adjustments-to-our-interview-process
