        - generic [ref=e17]:
          - generic [ref=e18]:
            - paragraph [ref=e19]: GitLab is the intelligent orchestration platform for DevSecOps. GitLab enables organizations to increase developer productivity, improve operational efficiency, reduce security and compliance risk, and accelerate digital transformation. More than 50 million registered users and more than 50% of the Fortune 100* trust GitLab to ship better, more secure software faster.
            - paragraph [ref=e20]:
              - text: "The same principles built into our products are reflected in how our team works: we embrace AI as a core productivity multiplier, with all team members expected to incorporate AI into their daily workflows to drive efficiency, innovation, and impact. GitLab is where careers accelerate, innovation flourishes, and every voice is valued. Our high-performance culture is driven by our values and continuous knowledge exchange, enabling our team members to reach their full potential while collaborating with industry leaders to solve complex problems."
              - link "Co-create the future with us" [ref=e21] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=OuZIb5zszQI
              - text: as we build technology that transforms how the world develops software.
            - paragraph [ref=e22]:
              - text: "*"
              - emphasis [ref=e23]: Fortune 500® is a registered trademark of Fortune Media IP Limited, used under license. Claim based on GitLab data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500 list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated with, and do not endorse products or services of GitLab.
          - generic [ref=e24]:
            - heading "An overview of this role" [level=2] [ref=e25]:
              - strong [ref=e26]: An overview of this role
            - paragraph [ref=e27]:
              - text: As
              - strong [ref=e28]: Vice President of Engineering
              - text: ", you will oversee a globally distributed engineering organization that sits at the center of our product and platform strategy. You will help shape how we build the future of an"
              - strong [ref=e29]: AI-powered DevSecOps platform
              - text: ", partnering closely with executive stakeholders across the business to align engineering direction with company priorities. This is a hands-on executive role for someone who brings technical depth, experience exercising sound judgment in complex engineering environments, and a track record of building and scaling systems, teams, and product delivery."
            - paragraph [ref=e30]: In this role, you will own engineering across multiple product areas, strengthen how teams deliver reliable and modern software, and help advance our AI-native approach across engineering workflows, developer tooling, code review, and continuous delivery. In your first year, you will be expected to set a clear engineering strategy, grow the engineering management team, improve operational maturity, and create the conditions for high-quality execution in our all-remote, handbook-first environment.
            - heading "What you’ll do" [level=2] [ref=e31]:
              - strong [ref=e32]: What you’ll do
            - list [ref=e33]:
              - listitem [ref=e34]:
                - strong [ref=e35]: Define
                - text: the engineering strategy for your functional area, aligning roadmap, investments, and organizational planning with GitLab's company direction.
              - listitem [ref=e36]:
                - strong [ref=e37]: Lead
                - text: a large, globally distributed engineering organization across multiple product domains, supporting Directors, Senior Managers, Engineering Managers, and their teams.
              - listitem [ref=e38]:
                - strong [ref=e39]: Drive
                - text: operational excellence through clear engineering metrics, strong incident management practices, and a disciplined approach to reliability, quality, and developer productivity.
              - listitem [ref=e40]:
                - strong [ref=e41]: Champion
                - text: AI-native engineering practices across workflows, platforms, and products, including developer tooling, code review, and CI/CD.
              - listitem [ref=e42]:
                - strong [ref=e43]: Partner
                - text: with Product Management to create a consistent, high-velocity working model between engineering and product teams.
              - listitem [ref=e44]:
                - strong [ref=e45]: Collaborate
                - text: with Finance and executive peers on headcount planning, budgeting, forecasting, and investment tradeoffs.
              - listitem [ref=e46]:
                - strong [ref=e47]: Work
                - text: with Sales, Marketing, Alliances, Customer Success, and security leaders to address enterprise needs and support strategic initiatives.
              - listitem [ref=e48]:
                - strong [ref=e49]: Represent
                - text: your engineering organization in executive discussions, board-level conversations, and external forums through clear communication and transparent documentation.
            - heading "What you’ll bring" [level=2] [ref=e50]:
              - strong [ref=e51]: What you’ll bring
            - list [ref=e52]:
              - listitem [ref=e53]:
                - strong [ref=e54]: Experience leading
                - text: large engineering organizations across multiple product areas in a distributed environment, including leadership through Directors and Senior Managers.
              - listitem [ref=e55]:
                - strong [ref=e56]: Strong technical credibility
                - text: with the ability to engage senior individual contributors and leaders on architecture, engineering quality, reliability, and system design tradeoffs.
              - listitem [ref=e57]:
                - strong [ref=e58]: Background building
                - text: scalable frontend platforms or large-scale user-facing systems, alongside backend or infrastructure experience.
              - listitem [ref=e59]:
                - strong [ref=e60]: Direct experience modernizing
                - text: a monolithic application into modular, independently deployable architecture in production, including runtime composition decisions and migration sequencing.
              - listitem [ref=e61]:
                - strong [ref=e62]: Experience developing
                - text: or scaling a design system that acts as a reliable contract between platform and product teams, with attention to versioning, testing, and documentation.
              - listitem [ref=e63]:
                - strong [ref=e64]: Familiarity with AI-powered product development
                - text: or integrating AI into developer workflows, with a clear understanding of the difference between AI features and AI-native architecture.
              - listitem [ref=e65]:
                - strong [ref=e66]: Ability to operate effectively
                - text: in a remote-first, asynchronous, documentation-heavy culture with clear written communication and sound organizational judgment.
              - listitem [ref=e67]:
                - strong [ref=e68]: Strength in cross-functional leadership
                - text: ", including work with executive stakeholders on business cases, investment planning, customer requirements, and balancing innovation with operational stability; we welcome candidates whose experience may come through different paths with relevant transferable skills."
            - heading "About the team" [level=2] [ref=e69]:
              - strong [ref=e70]: About the team
            - paragraph [ref=e71]: Our engineering organization spans several product and platform groups within GitLab's DevSecOps platform. We bring together senior engineering leaders who coordinate roadmaps, architectural decisions, and execution across shared systems and customer-facing experiences. In this role, you will join our leadership team as we develop managers, strengthen collaboration across groups, and help the organization scale effectively as GitLab grows.
