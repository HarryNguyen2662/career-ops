              - strong [ref=e88]: "Country Hiring Guidelines:"
              - text: GitLab hires new team members in countries around the world. All of our roles are remote, however some roles may carry specific location-based eligibility requirements. Our Talent Acquisition team can help answer any questions about location after starting the recruiting process.
            - paragraph [ref=e89]:
              - strong [ref=e90]: "Privacy Policy:"
              - text: Please review our
              - link "Recruitment Privacy Policy." [ref=e91] [cursor=pointer]:
