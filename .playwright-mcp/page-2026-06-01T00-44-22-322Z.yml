          - generic [ref=e18]:
            - paragraph [ref=e19]: GitLab is the intelligent orchestration platform for DevSecOps. GitLab enables organizations to increase developer productivity, improve operational efficiency, reduce security and compliance risk, and accelerate digital transformation. More than 50 million registered users and more than 50% of the Fortune 100* trust GitLab to ship better, more secure software faster.
            - paragraph [ref=e20]:
              - text: "The same principles built into our products are reflected in how our team works: we embrace AI as a core productivity multiplier, with all team members expected to incorporate AI into their daily workflows to drive efficiency, innovation, and impact. GitLab is where careers accelerate, innovation flourishes, and every voice is valued. Our high-performance culture is driven by our values and continuous knowledge exchange, enabling our team members to reach their full potential while collaborating with industry leaders to solve complex problems."
              - link "Co-create the future with us" [ref=e21] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=OuZIb5zszQI
              - text: as we build technology that transforms how the world develops software.
            - paragraph [ref=e22]:
              - text: "*"
              - emphasis [ref=e23]: Fortune 500® is a registered trademark of Fortune Media IP Limited, used under license. Claim based on GitLab data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500 list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated with, and do not endorse products or services of GitLab.
          - generic [ref=e24]:
            - heading "An overview of this role" [level=2] [ref=e25]
            - paragraph [ref=e26]:
              - text: You'll join the Dedicated team as a Site Reliability Engineer focused on
              - link "Environment Automation" [ref=e27] [cursor=pointer]:
                - /url: https://handbook.gitlab.com/handbook/engineering/infrastructure-platforms/gitlab-dedicated/environment-automation/
              - text: ", where your work will help power hundreds of isolated GitLab environments for our customers. In this role, you'll help keep these environments reliable, scalable, secure, and consistent by treating everything as code and contributing to automation across the entire lifecycle, from initial provisioning to day-to-day operations. Instead of operating a single platform, you'll collaborate with senior SREs to solve the unique challenges of managing many tenant environments in parallel, each with its own constraints and integration points."
            - paragraph [ref=e28]: You'll help define, deploy, and maintain GitLab environments across cloud providers using infrastructure as code, deployment packages, and Kubernetes. You'll contribute to automation that reduces manual work, assist in building tooling that orchestrates upgrades and configuration changes safely at scale, and support an observability stack that lets us understand and improve the health of every environment. Your work will directly impact how customers experience GitLab Dedicated and other managed offerings, enabling them to focus on building software while we ensure their GitLab environments are always production ready.
            - paragraph [ref=e29]: "Some examples of work you'll do:"
            - list [ref=e30]:
              - listitem [ref=e31]: Contribute to the design and evolution of infrastructure automation using Terraform, Ansible, and Kubernetes to provision, upgrade, and operate many GitLab environments with minimal manual effort
              - listitem [ref=e32]: Help debug and resolve production issues across Kubernetes clusters, GitLab components, and cloud services, then assist in building automation and safeguards that prevent similar issues from recurring
              - listitem [ref=e33]: Assist in creating and maintaining deployment and orchestration tools, such as Helm Charts, omnibus-gitlab configurations, and multi-tenant workflows, that make it easy for teams to manage GitLab environments at scale
            - heading "What you'll do" [level=2] [ref=e34]
            - list [ref=e35]:
              - listitem [ref=e36]: Contribute to automating operational tasks across many GitLab environments, from initial provisioning and configuration updates to upgrades and routine maintenance, helping reduce manual work and improve reliability at scale under the guidance of senior team members.
              - listitem [ref=e37]: Help build and refine the observability stack for multi-tenant GitLab environments so we monitor the right signals across Kubernetes, cloud services, and GitLab applications, supporting early issue detection and basic capacity tracking.
              - listitem [ref=e38]: Assist in responding to platform alerts and incidents, collaborating with Environment Automation SREs and engineering teams to troubleshoot production issues across multiple tenants and document findings.
              - listitem [ref=e39]: Support planning and implementation of infrastructure changes, capacity expansions, and new service rollouts for Dedicated and other managed GitLab environments, contributing to efforts that improve resource efficiency and environment isolation.
              - listitem [ref=e40]: Develop and maintain scripts, automation tools, and infrastructure-as-code workflows that manage parts of the GitLab environment lifecycle, enabling more repeatable, self-service operations over time.
              - listitem [ref=e41]: Apply and help implement best practices for running GitLab on Kubernetes and cloud platforms, focusing on day-to-day reliability, performance, and security while learning how to keep environments consistent.
              - listitem [ref=e42]: Participate in the on-call rotation for production GitLab environments with appropriate support, helping triage and mitigate incidents across clusters and cloud providers and contributing to post-incident reviews.
              - listitem [ref=e43]: Document operational tasks, runbooks, and lessons learned so they become clear, repeatable processes and can be candidates for future automation, improving shared knowledge and reducing manual toil across the team.
            - heading "What you'll bring" [level=2] [ref=e44]
            - list [ref=e45]:
              - listitem [ref=e46]: Experience working as an SRE or in a similar role operating production infrastructure, with an interest in automating the lifecycle of many environments or tenants in parallel, even if you have not yet done so at large scale.
              - listitem [ref=e47]: Hands-on experience with backend programming languages such as Golang, with the ability to read, understand, and modify infrastructure tools.
              - listitem [ref=e48]: Hands-on experience running Kubernetes-based workloads in production, including basic understanding of deployments, rollouts, and debugging common issues like crash loops, failed health checks, and scheduling problems.
              - listitem [ref=e49]: Familiarity with infrastructure automation and configuration management tools such as Terraform and Ansible, including experience working with modules, variables, and managing state safely for multiple environments.
              - listitem [ref=e50]: Solid understanding of Git-based workflows and infrastructure-as-code practices, with the ability to contribute to reusable modules, templates, and pipelines that make automation safer and more consistent.
              - listitem [ref=e51]: Experience working in distributed systems or cloud-based production environments, ideally in SaaS or managed service settings, with comfort participating in incident response and on-call rotations under guidance from more senior team members.
              - listitem [ref=e52]: A proactive mindset focused on automation and documentation—you look for opportunities to remove manual steps, improve runbooks, and turn repetitive tasks into reliable, self-service tools.
              - listitem [ref=e53]: Comfort working asynchronously across distributed teams and a desire to contribute to GitLab's values of collaboration, transparency, and iteration.
            - heading "About the team" [level=2] [ref=e54]
            - paragraph [ref=e55]:
              - text: We are responsible for building, running, and evolving the entire lifecycle of the GitLab environments that power the
              - link "GitLab Dedicated" [ref=e56] [cursor=pointer]:
                - /url: https://handbook.gitlab.com/handbook/engineering/infrastructure-platforms/gitlab-dedicated/
              - text: platform. You'll be part of our team focused on owning the reliability, scalability, performance, and security of automated single-tenant GitLab instances and their supporting services. GitLab Dedicated provides fully managed, isolated environments for customers around the world, which means your work directly impacts how organizations of all sizes run their mission-critical software delivery on GitLab. We operate in a fully distributed, asynchronous environment across multiple regions, collaborating on everything from infrastructure automation and environment lifecycle design to incident response and capacity planning. You'll be solving novel challenges at scale, from orchestrating infrastructure-as-code workflows across hundreds of tenants to designing the automation that keeps those environments consistent, secure, and up to date. We continuously seek to reduce complexity and improve efficiency by leveraging cloud vendor managed products and services where appropriate, ensuring GitLab Dedicated remains a best-in-class managed platform for our customers. For more on how we operate, see the relevant GitLab Dedicated and infrastructure handbook pages.
          - generic [ref=e58]:
            - paragraph [ref=e62]:
              - emphasis [ref=e63]:
                - text: The base salary range for this role’s listed level is currently for residents of the United States only. This range is intended to reflect the role's base salary rate in locations throughout the US. Grade level and salary ranges are determined through interviews and a review of education, experience, knowledge, skills, abilities of the applicant, equity with other team members, alignment with market data, and geographic location. The base salary range does not include any bonuses, equity, or benefits. See more information on our
                - link "benefits" [ref=e64] [cursor=pointer]:
                  - /url: https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/
                - text: and
                - link "equity" [ref=e65] [cursor=pointer]:
                  - /url: https://about.gitlab.com/handbook/stock-options/
                - text: . Sales roles are also eligible for incentive pay targeted at up to 100% of the offered base salary.
            - paragraph [ref=e66]: United States Salary Range
            - paragraph [ref=e67]: $126,400 - $213,600 USD
