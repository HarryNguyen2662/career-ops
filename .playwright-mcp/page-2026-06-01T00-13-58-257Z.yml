      - generic [ref=e68]:
        - generic [ref=e70]:
          - generic [ref=e71]:
            - paragraph [ref=e72]:
              - strong [ref=e74]: Who we are
            - paragraph [ref=e75]: "Samsara (NYSE: IOT) is the pioneer of the Connected Operations™ Cloud, which is a platform that enables organizations that depend on physical operations to harness Internet of Things (IoT) data to develop actionable insights and improve their operations. At Samsara, we are helping improve the safety, efficiency and sustainability of the physical operations that power our global economy. Representing more than 40% of global GDP, these industries are the infrastructure of our planet, including agriculture, construction, field services, transportation, and manufacturing — and we are excited to help digitally transform their operations at scale."
            - paragraph [ref=e76]: Working at Samsara means you’ll help define the future of physical operations and be on a team that’s shaping an exciting array of product solutions, including Video-Based Safety, Vehicle Telematics, Apps and Driver Workflows, and Equipment Monitoring. As part of a recently public company, you’ll have the autonomy and support to make an impact as we build for the long term.
          - paragraph [ref=e77]:
            - strong [ref=e79]: "About the role:"
          - paragraph [ref=e80]: Do you get excited about creating high-impact AI applications that employees rely on every day?
          - paragraph [ref=e81]: Samsara’s Integrations, Data Engineering, and AI (IDEA) team is a key part of Samsara’s Business Technology organization, driving innovation through data and AI. Our mission is to empower and enable everyone at Samsara with AI-powered tools and capabilities so they can get their work done more effectively. We bridge technology, innovation, and business needs to infuse AI-powered solutions into our organization.
          - paragraph [ref=e82]: We are looking for a hands-on AI Engineer to build, ship, and scale Samsara’s AI applications and capabilities end-to-end. As an AI Engineer IV, you’ll own the full lifecycle of AI-powered systems — from initial design and prototyping to production deployment, monitoring, and iteration. You will collaborate with architects, engineers, and cross-functional stakeholders across Samsara to brainstorm, design, rapidly prototype, and productionalize AI-driven features and capabilities that integrate deeply into real business workflows.
          - paragraph [ref=e83]:
            - strong [ref=e85]: This role is open to candidates residing in Canada.
          - paragraph [ref=e86]:
            - strong [ref=e88]: "You should apply if:"
          - list [ref=e89]:
            - listitem [ref=e90]:
              - generic [ref=e91]:
                - strong [ref=e92]: "You want to impact the industries that run our world:"
                - text: Your efforts will result in real-world impact—helping to keep the lights on, get food into grocery stores, reduce emissions, and most importantly, ensure workers return home safely.
            - listitem [ref=e93]:
              - generic [ref=e94]:
                - strong [ref=e95]: "You are the architect of your own career:"
                - text: If you put in the work, this role won’t be your last at Samsara. We set up our employees for success and have built a culture that encourages rapid career development, countless opportunities to experiment, and mastery of your craft in a hyper-growth environment.
            - listitem [ref=e96]:
              - generic [ref=e97]:
                - strong [ref=e98]: "You are energized by our opportunity:"
                - text: The vision we have to digitize large sectors of the global economy requires your full focus and best efforts to bring forth creative, ambitious ideas for our customers.
            - listitem [ref=e99]:
              - generic [ref=e100]:
                - strong [ref=e101]: "You want to be with the best:"
                - text: At Samsara, we win together, celebrate together, and support each other. You will be surrounded by a high-caliber team that will encourage you to do your best.
          - paragraph [ref=e102]:
            - strong [ref=e104]: "In this role, you will:"
          - list [ref=e105]:
            - listitem [ref=e106]: Build, ship, and own end-to-end AI-powered applications, from ideation and prototyping through production deployment, monitoring, and ongoing iteration.
            - listitem [ref=e107]: Architect and scale company-wide GenAI capabilities and domain-specific business applications that are embedded into real operational workflows.
            - listitem [ref=e108]: Design and integrate AI solutions with internal systems and third-party platforms, including SaaS tools, APIs, data platforms, and enterprise systems.
            - listitem [ref=e109]: Develop and launch AI-powered solutions to improve efficiency and personalization across business functions such as Customer Support, People/HR, Legal, and Finance.
            - listitem [ref=e110]: Collaborate closely with top-tier engineers, data scientists, and business users in a fast-moving environment.
            - listitem [ref=e111]: Apply and scale software engineering excellence, including reliability, observability, and maintainability of production AI systems.
          - paragraph [ref=e112]:
            - strong [ref=e114]: "Minimum Requirements for the role:"
          - list [ref=e115]:
            - listitem [ref=e116]: Bachelor’s or Master’s degree in Computer Science or related Engineering discipline.
            - listitem [ref=e117]: 5+ years of industry experience in software engineering or AI product development, including
            - listitem [ref=e118]: 3+ years of experience owning the development, testing, deployment, monitoring, and support of web applications and backend APIs.
            - listitem [ref=e119]: 1+ year of experience building and deploying production-ready Generative AI solutions, with responsibility for reliability and performance.
            - listitem [ref=e120]: Strong expertise in Python and AI/ML fundamentals, particularly Generative AI solutions (e.g., LLMs, vector databases, prompt engineering, embeddings, RAG systems).
            - listitem [ref=e121]: Experience with AI agent development frameworks and tooling (e.g., LangChain, LangGraph, CrewAI, LlamaIndex, OpenAI SDK, MCP, A2A).
          - paragraph [ref=e122]:
            - strong [ref=e124]: "An ideal candidate is:"
          - list [ref=e125]:
            - listitem [ref=e126]: Experienced in 0→1 MVP development, iterative prototyping, and evolving prototypes into production-grade systems.
            - listitem [ref=e127]: Passionate about staying up to date with industry news, AI development trends, tools, and best practices.
            - listitem [ref=e128]: Knowledgeable about SDLC best practices and actively experiments with and adopts modern AI development tools and patterns.
            - listitem [ref=e129]: An excellent communicator with the ability to work effectively in cross-functional settings and translate business needs into technical solutions.
          - generic [ref=e131]:
            - paragraph [ref=e133]: The range of annual base salary for full-time employees for this position is below. Please note that base pay offered may vary depending on factors including your city of residence, job-related knowledge, skills, and experience. This role is also eligible for an initial RSU grant with no vesting cliff, and ongoing refresh opportunities tied to performance, subject to plan terms and conditions. Learn more about our total rewards and benefits below.
            - generic [ref=e134]: Annual Base Salary
            - generic [ref=e135]: $104,550—$135,300 CAD
          - generic [ref=e136]:
            - paragraph [ref=e137]:
              - strong [ref=e138]: Total Rewards
            - paragraph [ref=e139]:
              - text: At Samsara, we build for the people who keep the global economy moving. We want owners, not passengers, which is why
              - link "our rewards" [ref=e140] [cursor=pointer]:
                - /url: https://www.samsara.com/company/careers/benefits
              - text: are designed to fuel high-impact builders. Our compensation program delivers above-market total compensation through a combination of base salary, performance-based bonus/variable pay, and equity (for eligible roles) in a high-growth public company. We meaningfully differentiate pay for our top performers, who have the opportunity to earn above-market compensation that can outpace the broader market over time.
            - paragraph [ref=e141]: "Beyond compensation, we provide the foundations that enable long-term success: a flexible, employee-led remote model, a professional development stipend, comprehensive health and parental leave plans, and more. If you’re ready to build for the long term and own the outcome, your journey starts here."
            - paragraph [ref=e142]:
              - strong [ref=e143]: Flexible Working
            - paragraph [ref=e144]: At Samsara, we embrace a flexible working model that caters to the diverse needs of our teams. Our offices are open for those who prefer to work in-person and we also support remote work where it aligns with our operational requirements. For certain positions, being close to one of our offices or within a specific geographic area is important to facilitate collaboration, access to resources, or alignment with our service regions. In these cases, the job description will clearly indicate any working location requirements. Our goal is to ensure that all members of our team can contribute effectively, whether they are working on-site, in a hybrid model, or fully remotely. All offers of employment are contingent upon an individual’s ability to secure and maintain the legal right to work at the company and in the specified work location, if applicable.
            - paragraph [ref=e145]:
              - strong [ref=e146]: Belonging at Samsara
            - paragraph [ref=e147]: At Samsara, we welcome everyone regardless of their background. All qualified applicants will receive consideration for employment without regard to race, color, religion, national origin, sex, gender, gender identity, sexual orientation, protected veteran status, disability, age, and other characteristics protected by law. We depend on the unique approaches of our team members to help us solve complex problems and want to ensure that Samsara is a place where people from all backgrounds can make an impact.
            - paragraph [ref=e148]:
              - strong [ref=e149]: Accommodations
            - paragraph [ref=e150]:
              - text: Samsara is an inclusive work environment, and we are committed to ensuring equal opportunity in employment for qualified persons with disabilities. Please email
              - link "accessibleinterviewing@samsara.com" [ref=e151] [cursor=pointer]:
                - /url: mailto:accessibleinterviewing@samsara.com
              - text: or
              - link "click here" [ref=e152] [cursor=pointer]:
                - /url: https://forms.gle/DrM6DFQUiSgfPtCVA
              - text: if you require any reasonable accommodations throughout the recruiting process.
            - paragraph [ref=e153]:
              - strong [ref=e154]: Our Commitment to Authenticity
            - paragraph [ref=e155]:
              - text: We use
              - link "Tofu" [ref=e156] [cursor=pointer]:
                - /url: https://hiretofu.com/privacyPolicy
              - text: ", a fraud detection tool, to validate the authenticity of applications and protect against identity fraud. This ensures we are connecting with real people and allows us to prioritize genuine candidates. Please see Samsara’s"
              - link "Candidate Privacy Notice" [ref=e157] [cursor=pointer]:
                - /url: https://www.samsara.com/legal/candidate-privacy-notice
              - text: for more information.
            - paragraph [ref=e158]:
              - strong [ref=e159]: Fraudulent Employment Offers
            - paragraph [ref=e160]:
              - text: Samsara is aware of scams involving fake job interviews and offers. Please know we do not charge fees to applicants at any stage of the hiring process. Official communication about your application will only come from emails ending in @samsara.com, @us-greenhouse-mail.io or @mail3.guide.co. For more information regarding fraudulent employment offers, please visit our
              - link "blog post here" [ref=e161] [cursor=pointer]:
                - /url: https://samsara.com/blog/avoiding-fake-job-offers
              - text: .
