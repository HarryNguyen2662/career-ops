        - generic [ref=e19]:
          - generic [ref=e20]:
            - strong [ref=e23]: "About Glean:"
            - generic [ref=e25]: Glean is the Work AI platform that helps everyone work smarter with AI. What began as the industry’s most advanced enterprise search has evolved into a full-scale Work AI ecosystem, powering intelligent Search, an AI Assistant, and scalable AI agents on one secure, open platform. With over 100 enterprise SaaS connectors, flexible LLM choice, and robust APIs, Glean gives organizations the infrastructure to govern, scale, and customize AI across their entire business - without vendor lock-in or costly implementation cycles.
            - generic [ref=e27]: "At its core, Glean is redefining how enterprises find, use, and act on knowledge. Its Enterprise Graph and Personal Knowledge Graph map the relationships between people, content, and activity, delivering deeply personalized, context-aware responses for every employee. This foundation powers Glean’s agentic capabilities - AI agents that automate real work across teams by accessing the industry’s broadest range of data: enterprise and world, structured and unstructured, historical and real-time. The result: measurable business impact through faster onboarding, hours of productivity gained each week, and smarter, safer decisions at every level."
            - generic [ref=e29]: Recognized by Fast Company as one of the World’s Most Innovative Companies (Top 10, 2025), by CNBC’s Disruptor 50, Bloomberg’s AI Startups to Watch (2026), Forbes AI 50, and Gartner’s Tech Innovators in Agentic AI, Glean continues to accelerate its global impact. With customers across 50+ industries and 1,000+ employees in more than 25 countries, we’re helping the world’s largest organizations make every employee AI-fluent, and turning the superintelligent enterprise from concept into reality.
            - generic [ref=e31]: If you’re excited to shape how the world works, you’ll help build systems used daily across Microsoft Teams, Zoom, ServiceNow, Zendesk, GitHub, and many more - deeply embedded where people get things done. You’ll ship agentic capabilities on an open, extensible stack, with the craft and care required for enterprise trust, as we bring Work AI to every employee, in every company.
          - generic [ref=e32]:
            - strong [ref=e36]: "About the Role:"
            - paragraph [ref=e37]: We’re seeking an engineer to work on the billing and revenue platform that powers Glean’s consumption-based pricing for our AI products. As an engineer, you’ll work on deep technical problems and own critical parts of our billing stack end to end. You’ll work closely with Product, Finance, Data, and Go-To-Market to ensure every AI feature we ship is accurately metered, transparently billed, and margin-positive. At the same time, you’ll help design powerful, elegant abstractions that make it easy and safe for product teams to integrate with billing—from logging usage to surfacing billing insights in the admin console.
            - paragraph [ref=e38]:
              - strong [ref=e40]: "You will:"
            - list [ref=e41]:
              - listitem [ref=e42]: Work hands-on to design and implement systems for usage metering, pricing logic, credits, and admin-facing billing dashboards.
              - listitem [ref=e43]: Drive the evolution of our consumption / Flex pricing infrastructure in a fast-paced environment, with a high bar for correctness, reliability, and debuggability.
              - listitem [ref=e44]: Partner with Finance, Pricing, RevOps, and Product to translate pricing strategy into robust technical designs and workflows.
              - listitem [ref=e45]: Define and maintain guardrails for LLM and agent costs (e.g., limits, anomaly detection, margin monitoring) so product teams can ship AI features confidently.
              - listitem [ref=e46]: Raise the bar for engineering quality through design reviews and code reviews.
            - paragraph [ref=e47]:
              - strong [ref=e49]: "About you:"
            - list [ref=e50]:
              - listitem [ref=e51]: 2+ years of industry software engineering experience
              - listitem [ref=e52]: Experience building backend systems and web interfaces, including frontend, APIs, and backend services.
              - listitem [ref=e53]: Strong ability to make tradeoffs explicit, and align cross-functional stakeholders around pragmatic decisions.
              - listitem [ref=e54]: An owner mindset and excitement about being in a product-focused environment where everyone cares deeply about customer and business impact.
              - listitem [ref=e55]: Expertise in Golang, Java, Typescript, SQL is highly desirable.
              - listitem [ref=e56]: Experience with or desire to learn large language models, retrieval augmented generation, agents, and their cost structures is beneficial.
            - paragraph [ref=e57]:
              - strong [ref=e59]: "Location:"
            - list [ref=e60]:
              - listitem [ref=e61]: This role is hybrid (4 days a week in our Mountain View office)
            - paragraph [ref=e62]:
              - strong [ref=e64]: "Compensation & Benefits:"
            - paragraph [ref=e65]: The standard base salary range for this position is $140,000 - $265,000 annually. Compensation offered will be determined by factors such as location, level, job-related knowledge, skills, and experience. Certain roles may be eligible for variable compensation, equity, and benefits.
            - paragraph [ref=e66]: We offer a comprehensive benefits package including competitive compensation, Medical, Vision, and Dental coverage, generous time-off policy, and the opportunity to contribute to your 401k plan to support your long-term goals. When you join, you'll receive a home office improvement stipend, as well as an annual education and wellness stipends to support your growth and wellbeing. We foster a vibrant company culture through regular events, and provide healthy lunches daily to keep you fueled and focused.
            - paragraph [ref=e67]: We are a diverse bunch of people and we want to continue to attract and retain a diverse range of people into our organization. We're committed to an inclusive and diverse company. We do not discriminate based on gender, ethnicity, sexual orientation, religion, civil or family status, age, disability, or race.
            - paragraph [ref=e68]:
              - generic [ref=e69]: "#LI-HYBRID"
          - generic [ref=e70]:
            - strong [ref=e74]: "AI-First Mindset at Glean:"
            - generic [ref=e77]:
              - text: At Glean, AI fluency is core to how we work and we're committed to ensuring every new hire feels confident integrating AI into their everyday work.
              - strong [ref=e78]: As part of the interview process, you'll complete a brief AI-focused exercise or discussion so we can understand how you think about, design, and use AI to drive impact in your role.
              - text: Feel free to reference any tools, platforms, or workflows you use today — prior Glean experience isn't required.
            - strong [ref=e82]: "Global Data Privacy Notice for Job Candidates and Applicants:"
            - generic [ref=e85]:
              - text: Depending on your location, the General Data Protection Regulation (GDPR), California Consumer Privacy Act (CCPA), or other privacy laws may regulate the way we manage the data of job applicants. Our full notice outlining how data will be processed as part of the application procedure for applicable locations is available in our
              - link "Privacy Policy" [ref=e86] [cursor=pointer]:
                - /url: https://www.glean.com/privacy
                - strong [ref=e87]: Privacy Policy
              - text: . By submitting your application, you are agreeing to our use and processing of your data as required. US applicants and their applications are subject to arbitration of disputes as outlined in our
              - link "Applicant Arbitration Agreement" [ref=e88] [cursor=pointer]:
                - /url: https://www.glean.com/arbitrationagreement
                - strong [ref=e89]: Applicant Arbitration Agreement
              - text: .
            - generic [ref=e91]:
              - text: By clicking “Submit Application,” I confirm that I have read the Global Data Privacy Notice and the
              - link "Applicant Arbitration Agreement" [ref=e92] [cursor=pointer]:
                - /url: https://www.glean.com/arbitrationagreement
                - strong [ref=e93]: Applicant Arbitration Agreement
              - text: ", and I agree to the terms."
