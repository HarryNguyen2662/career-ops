              - listitem [ref=e415]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
              - listitem [ref=e416]: Blind or low vision
              - listitem [ref=e417]: Cancer (past or present)
              - listitem [ref=e418]: Cardiovascular or heart disease
              - listitem [ref=e419]: Celiac disease
              - listitem [ref=e420]: Cerebral palsy
              - listitem [ref=e421]: Deaf or serious difficulty hearing
              - listitem [ref=e422]: Diabetes
              - listitem [ref=e423]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
              - listitem [ref=e424]: Epilepsy or other seizure disorder
              - listitem [ref=e425]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
              - listitem [ref=e426]: Intellectual or developmental disability
              - listitem [ref=e427]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
              - listitem [ref=e428]: Missing limbs or partially missing limbs
              - listitem [ref=e429]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
              - listitem [ref=e430]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
              - listitem [ref=e431]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
              - listitem [ref=e432]: Partial or complete paralysis (any cause)
              - listitem [ref=e433]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
              - listitem [ref=e434]: Short stature (dwarfism)
              - listitem [ref=e435]: Traumatic brain injury
