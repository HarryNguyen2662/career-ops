          - heading "Backend Software Engineer — Data Platform & AI Data Products" [level=1] [ref=e11]
          - generic [ref=e12]:
            - img [ref=e13]
            - generic [ref=e15]: San Francisco
        - button "Apply" [ref=e16] [cursor=pointer]
      - generic [ref=e18]:
        - heading "About the Role" [level=3] [ref=e19]:
          - strong [ref=e20]: About the Role
        - paragraph [ref=e21]: You’ll join the Data Platform team, responsible for building the backend services and “data products” that power how data moves through the company. We create the core platform primitives — high-quality event streams, reliable access layers, and developer-friendly APIs/tools — so teams across the org can self-serve what they need and ship faster. You’ll contribute to backend services that create value from our company data, and help make our data platform more self-serve so product and engineering teams can easily create and operate event-driven architectures, publish/consume streams, define access models, and ship data products end-to-end. You’ll also work on LLM-adjacent services such as prompt categorization/taxonomy, enrichment, and metadata systems that turn raw telemetry into trusted, usable products — with mentorship and support from experienced engineers.
        - paragraph [ref=e22]:
          - strong [ref=e23]: Responsibilities
        - list [ref=e24]:
          - listitem [ref=e25]: Contribute to backend services that enhance the data platform’s capabilities (APIs, control planes, automation, governance).
          - listitem [ref=e26]: "Help enable DIY workflows for teams across the company:"
        - list [ref=e27]:
          - listitem [ref=e28]:
            - list [ref=e29]:
              - listitem [ref=e30]: Define/publish events and schemas
              - listitem [ref=e31]: Create/consume streams and subscriptions
              - listitem [ref=e32]: Establish access models (authz, row/field-level controls where applicable)
              - listitem [ref=e33]: Manage dataset/catalog metadata, lineage, versioning, and retention
        - list [ref=e34]:
          - listitem [ref=e35]: "Contribute to end-to-end data products: ingestion → validation/quality → enrichment → serving (APIs/streams) → observability → adoption."
          - listitem [ref=e36]: "Work on prompt categorization and enrichment services: taxonomy design, labeling workflows, classifier/rules integration, evaluation, drift/quality monitoring, and safe rollouts."
          - listitem [ref=e37]: "Learn to own reliability: SLOs, alerting, performance/cost tuning, incident response, and postmortems."
          - listitem [ref=e38]: Partner cross-functionally with ML/LLM, infra, security, and product teams to define crisp contracts and deliver durable platform primitives.
        - heading "Requirements" [level=3] [ref=e39]:
          - strong [ref=e40]: Requirements
        - list [ref=e41]:
          - listitem [ref=e42]: 0–4 years building production or project-based backend systems (internships, coursework, and personal projects count).
          - listitem [ref=e43]: Solid fundamentals in at least one backend language (e.g., Go, Python, Java, Rust) and some exposure to API design (REST).
          - listitem [ref=e44]: "Eagerness to own work end-to-end: design docs, implementation, testing, deployment, and iteration based on real usage."
          - listitem [ref=e45]: "Strong engineering fundamentals: clean, maintainable code, thoughtful abstractions, and a desire to build systems that are easy to evolve."
          - listitem [ref=e46]: "Basic data modeling and SQL skills, and some familiarity with at least one of:"
        - list [ref=e47]:
          - listitem [ref=e48]:
            - list [ref=e49]:
              - listitem [ref=e50]: Streaming/eventing (Kafka/PubSub/Kinesis, etc.)
              - listitem [ref=e51]: Workflow/compute (Airflow/Spark/Flink/Trino, etc.)
              - listitem [ref=e52]: OLTP/OLAP stores and data lakes (Postgres + warehouse/lake tech)
        - list [ref=e53]:
          - listitem [ref=e54]: "AI augmentation curiosity:"
        - list [ref=e55]:
          - listitem [ref=e56]:
            - list [ref=e57]:
              - listitem [ref=e58]: You’re curious about how engineers use AI/LLMs to build software faster and better (e.g., coding copilots, agentic workflows, retrieval/knowledge grounding), and you’re eager to apply this to your own work.
              - listitem [ref=e59]: You understand that AI tools can fail or create issues, and you’re thoughtful about when and how to apply them.
        - heading "Nice to have" [level=2] [ref=e60]:
          - strong [ref=e62]: Nice to have
        - list [ref=e63]:
          - listitem [ref=e64]: Any exposure to self-serve platforms, developer tooling, or multi-tenant services.
          - listitem [ref=e65]: "Coursework or projects involving LLM/AI products: prompt/response telemetry, eval datasets, embeddings/RAG metadata, model/tool traces, privacy-safe logging."
          - listitem [ref=e66]: Passion for good quality code, highly readable, SOLID principles, design patterns, Domain Driven Design.
          - listitem [ref=e67]: "Awareness of security and governance basics: least-privilege access, auditability, data retention, PII handling."
        - heading "About Together AI" [level=3] [ref=e68]:
          - strong [ref=e69]: About Together AI
        - paragraph [ref=e70]: Together AI is a research-driven artificial intelligence company. We believe open and transparent AI systems will drive innovation and create the best outcomes for society, and together we are on a mission to significantly lower the cost of modern AI systems by co-designing software, hardware, algorithms, and models. We have contributed to leading open-source research, models, and datasets to advance the frontier of AI, and our team has been behind technological advancement such as FlashAttention, Hyena, FlexGen, and RedPajama. We invite you to join a passionate group of researchers and engineers in our journey in building the next generation AI infrastructure.
        - heading "Compensation" [level=3] [ref=e71]:
          - strong [ref=e72]: Compensation
        - paragraph [ref=e73]: "We offer competitive compensation, startup equity, health insurance and other competitive benefits. The US base salary range for this full-time position is: $120,000 - $170,000 + equity + benefits. Our salary ranges are determined by location, level and role. Individual compensation will be determined by experience, skills, and job-related knowledge."
        - heading "Equal Opportunity" [level=3] [ref=e74]:
          - strong [ref=e75]: Equal Opportunity
        - paragraph [ref=e76]: Together AI is an Equal Opportunity Employer and is proud to offer equal employment opportunity to everyone regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity, veteran status, and more.
        - paragraph [ref=e77]:
          - text: Please see our privacy policy at
          - link "https://www.together.ai/privacy" [ref=e78] [cursor=pointer]:
            - /url: https://www.together.ai/privacy
