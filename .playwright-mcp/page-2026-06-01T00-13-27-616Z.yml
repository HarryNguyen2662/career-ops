            - generic [ref=e47]:
              - paragraph [ref=e48]:
                - strong [ref=e49]: Why join us
              - paragraph [ref=e50]: Brex is the intelligent finance platform that enables companies to spend smarter and move faster in more than 200 markets. By combining global corporate cards and banking with intuitive spend management, bill pay, and travel software, Brex enables founders and finance teams to accelerate operations, gain real-time visibility, and control spend effortlessly. Brex’s AI-native automation and world-class service eliminate manual expense and accounting tasks for customers so they can focus on what matters most. Tens of thousands of the world's best companies run on Brex, including DoorDash, Coinbase, Robinhood, Zoom, Plaid, Reddit, and SeatGeek.
              - paragraph [ref=e51]: Working at Brex allows you to push your limits, challenge the status quo, and collaborate with some of the brightest minds in the industry. We’re committed to building a diverse team and inclusive culture and believe your potential should only be limited by how big you can dream. We make this a reality by empowering you with the tools, resources, and support you need to grow your career.
            - paragraph [ref=e52]:
              - strong [ref=e53]: Engineering at Brex
            - paragraph [ref=e54]: Engineering at Brex is about building systems that scale with speed and intention. Our teams span Software, Data, Security, and IT, and operate with high autonomy and deep collaboration. We tackle hard technical problems, own our outcomes, and push for excellence at every level — from architecture to deployment. It’s an environment where engineering is a craft, and builders become leaders.
            - paragraph [ref=e55]:
              - strong [ref=e56]: What you’ll do
            - paragraph [ref=e57]: As an engineer at Brex, you will help develop new products from concept to launch, whether for a 5-person startup or a 5,000-person-strong enterprise. We’re looking for folks with an interest in building products and tools, and who are comfortable in dealing with lots of moving pieces. You’ll be building customer-facing products that will drive direct business impact and shape our long-term technical vision with a high-quality bar. You'll have the opportunity to learn and push the frontier of providing the best financial software experience to help companies grow. You’ll be encouraged to be metric and data-driven and to think creatively to help Brex scale and get prepared for the new markets we are about to enter.
            - paragraph [ref=e58]:
              - strong [ref=e59]: Where you’ll work
            - paragraph [ref=e60]: This role will be based in our San Francisco. We are a hybrid environment that combines the energy and connections of being in the office with the benefits and flexibility of working from home. We currently require a minimum of three coordinated days in the office per week, Monday, Wednesday and Thursday. As a perk, we also have up to four weeks per year of fully remote work!
            - paragraph [ref=e61]:
              - strong [ref=e62]: "Responsibilities:"
            - list [ref=e63]:
              - listitem [ref=e64]: • Collaborate with engineers across the company to build new features and products end-to-end.
              - listitem [ref=e65]: • Work alongside user-facing teams like Sales and Support to deeply understand our customers' needs.
              - listitem [ref=e66]: • Design and implement solutions to improve our customers' banking experiences.
              - listitem [ref=e67]: • Own problems end-to-end, from user experience and data models to scalability, operability, and ongoing metrics.
              - listitem [ref=e68]: • Tune and polish features to a high degree of excellence.
            - paragraph [ref=e69]:
              - strong [ref=e70]: "Requirements:"
            - list [ref=e71]:
              - listitem [ref=e72]: • 4+ years of professional experience designing, developing, and deploying full-stack applications.
              - listitem [ref=e73]: • Experience architecting, developing, and testing client-side code end-to-end.
              - listitem [ref=e74]: • A high bar for engineering standards and a willingness to learn.
              - listitem [ref=e75]: • This role will be based in either New York, San Francisco, or our Seattle office. We are a hybrid environment that combines the energy and connections of being in the office with the benefits and flexibility of working from home. We currently require a minimum of three coordinated days in the office per week, Monday, Wednesday and Thursday. As a perk, we also have up to four weeks per year of fully remote work!
            - paragraph [ref=e76]:
              - strong [ref=e77]: "Compensation:"
            - paragraph [ref=e78]: The expected salary range for this role is $152,000 - $190,000. However, the starting base pay will depend on a number of factors including the candidate’s location, skills, experience, market demands, and internal pay parity. Depending on the position offered, equity and other forms of compensation may be provided as part of a total compensation package.
            - paragraph [ref=e80]:
              - emphasis [ref=e81]:
                - text: Please be aware, job-seekers may be at risk of targeting by malicious actors looking for personal data. Brex recruiters will only reach out via LinkedIn or email with a
                - link "brex.com" [ref=e82] [cursor=pointer]:
                  - /url: http://brex.com/
                - text: domain. Any outreach claiming to be from Brex via other sources should be ignored.
