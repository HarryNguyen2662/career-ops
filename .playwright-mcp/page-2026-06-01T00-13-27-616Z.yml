                        - strong [ref=f1e347]: How do you know if you have a disability?
                        - paragraph [ref=f1e348]:
                          - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                          - strong [ref=f1e349]: "Disabilities include, but are not limited to:"
                        - list [ref=f1e350]:
                          - listitem [ref=f1e351]: Alcohol or other substance use disorder (not currently using drugs illegally)
                          - listitem [ref=f1e352]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                          - listitem [ref=f1e353]: Blind or low vision
                          - listitem [ref=f1e354]: Cancer (past or present)
                          - listitem [ref=f1e355]: Cardiovascular or heart disease
                          - listitem [ref=f1e356]: Celiac disease
                          - listitem [ref=f1e357]: Cerebral palsy
                          - listitem [ref=f1e358]: Deaf or serious difficulty hearing
                          - listitem [ref=f1e359]: Diabetes
                          - listitem [ref=f1e360]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                          - listitem [ref=f1e361]: Epilepsy or other seizure disorder
                          - listitem [ref=f1e362]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                          - listitem [ref=f1e363]: Intellectual or developmental disability
                          - listitem [ref=f1e364]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                          - listitem [ref=f1e365]: Missing limbs or partially missing limbs
                          - listitem [ref=f1e366]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                          - listitem [ref=f1e367]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                          - listitem [ref=f1e368]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                          - listitem [ref=f1e369]: Partial or complete paralysis (any cause)
                          - listitem [ref=f1e370]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                          - listitem [ref=f1e371]: Short stature (dwarfism)
                          - listitem [ref=f1e372]: Traumatic brain injury
