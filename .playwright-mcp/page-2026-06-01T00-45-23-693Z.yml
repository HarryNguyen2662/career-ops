        - generic [ref=e22]:
          - generic [ref=e23]:
            - heading "About Flexport:" [level=2] [ref=e24]:
              - strong [ref=e25]: "About Flexport:"
            - paragraph [ref=e26]: At Flexport, we believe global trade can move the human race forward. That’s why it’s our mission to make global commerce so easy there will be more of it. We’re shaping the future of a $10T industry with solutions powered by innovative technology and exceptional people. Today, companies of all sizes—from emerging brands to Fortune 500s—use Flexport technology to move more than $19B of merchandise across 112 countries a year.
            - paragraph [ref=e27]: The recent global supply chain crisis has put Flexport center stage as we continue to play a pivotal role in how goods move around the world. We are proud to have the support of the best investors in the game who believe in our mission, solutions and people. Ready to tackle global challenges that impact business, society, and the environment? Come join us.
          - generic [ref=e28]:
            - heading "The Opportunity" [level=3] [ref=e29]:
              - strong [ref=e30]: The Opportunity
            - paragraph [ref=e31]: Join a new engineering team in San Francisco building Flexport’s client-facing rates platform and self-serve freight booking experience from the ground up. You will work alongside experienced engineers and have direct ownership of features that move the company from an assisted-sales model to a tech-run one for the long tail of our client base.
            - paragraph [ref=e32]: "This team owns two of the highest-leverage surfaces in the Client App: how clients see pricing and how they book without manual intervention. Rates sit at the center of every freight decision, and you will build the systems that power rate visibility, quoting, and pricing intelligence across ocean, air, and trucking. You will also help build the infrastructure that integrates AI-powered automation into the booking flow. This is a rare opportunity to build the \"front door\" of an $8.6 trillion industry, turning the complexity of global trade into a seamless digital experience for thousands of shippers."
            - heading "You Will" [level=3] [ref=e33]:
              - strong [ref=e34]: You Will
            - list [ref=e35]:
              - listitem [ref=e36]: Design, develop, test, deploy, and maintain systems within a microservices architecture that power rate visibility and autonomous booking.
              - listitem [ref=e37]: "Own the entire lifecycle of a feature: from database schema design and scalable backend APIs to building the React-based frontend applications our customers use."
              - listitem [ref=e38]: Support the integration of AI models and automated workflows to make the pricing and booking experience increasingly intelligent.
              - listitem [ref=e39]: Collaborate with engineering, product, and design to translate complex business problems into elegant, production-ready technical solutions.
              - listitem [ref=e40]: Contribute to code reviews to maintain high quality standards, share knowledge, and mentor peer engineers.
              - listitem [ref=e41]: Build highly available, secure, and distributed systems that can scale with Flexport’s global volume.
              - listitem [ref=e42]: Rapidly build and launch products incrementally, leveraging best practices around CI/CD and shipping to production dozens of times per day.
              - listitem [ref=e43]: Ensure high-quality standards by incorporating metrics, monitoring, and applying learnings from post-mortems to all services.
            - heading "You Should Have" [level=3] [ref=e44]:
              - strong [ref=e45]: You Should Have
            - list [ref=e46]:
              - listitem [ref=e47]: Bachelor’s degree in Computer Science, Software Engineering, or a related field, or equivalent practical experience.
              - listitem [ref=e48]: 3+ years of professional software engineering experience with a proven track record of shipping production-grade applications.
              - listitem [ref=e49]:
                - strong [ref=e50]: "Full-Stack Capability:"
                - text: "You are comfortable owning a feature from end-to-end: working with databases, backend services (Java/Ruby), and frontend frameworks (React)."
              - listitem [ref=e51]:
                - strong [ref=e52]: "Technical Rigor:"
                - text: A passion for simple, well-tested code that is easy to extend and hard to break.
              - listitem [ref=e53]:
                - strong [ref=e54]: "AI Familiarity:"
                - text: Experience or interest in working with AI APIs and building software that leverages machine learning models to automate user tasks.
              - listitem [ref=e55]: 2+ years of design and architecture knowledge as well as familiarity with object-oriented analysis and design patterns.
              - listitem [ref=e56]: "Proficiency with modern programming languages: specifically Java, Ruby, or TypeScript."
              - listitem [ref=e57]: Proficiency with deploying, monitoring, and maintaining production services on cloud infrastructure (AWS).
            - heading "It’s a Plus If You Have" [level=3] [ref=e58]:
              - strong [ref=e59]: It’s a Plus If You Have
            - list [ref=e60]:
              - listitem [ref=e61]: "Experience with elements of our tech stack: Java, Spring Boot, Ruby on Rails, React, AWS."
              - listitem [ref=e62]: Experience in fintech, pricing engines, or booking systems.
              - listitem [ref=e63]: Experience in logistics, supply chain, or freight technology.
              - listitem [ref=e64]:
                - strong [ref=e65]: "A bias for action:"
                - text: When you see a problem, you fix it.
              - listitem [ref=e66]: "Excellent written and verbal communication skills: you can convey technical ideas in common terms to business stakeholders and product managers."
            - paragraph [ref=e67]: "#LI-onsite"
          - generic [ref=e69]:
            - emphasis [ref=e83]: The range displayed on each job posting reflects the minimum and maximum target for new hire base salary for the position in the posting's respective region. Our salary ranges are determined by role, level, and location. Within the range displayed, individual pay is determined by work location and additional factors, including job-related skills, experience, and relevant education and / or training. Base salary is just one part of our total rewards package at Flexport, which also includes bonus, equity, and comprehensive benefit offerings such as medical, dental, and flexible time off.
            - paragraph [ref=e84]: "The US base salary range for this position (this does not include bonus, equity and benefits):"
            - paragraph [ref=e85]: $147,000 - $183,750 USD
          - generic [ref=e97]:
            - heading "Commitment to Equal Opportunity" [level=4] [ref=e98]
            - paragraph [ref=e99]: At Flexport, our ability to fulfill our mission of making global commerce easy and accessible relies on having a diverse, dedicated and engaged workforce. All qualified applicants will receive consideration for employment regardless of race, color, religion, sex, national origin, age, physical and mental disability, health status, marital and family status, sexual orientation, gender identity and expression, military and veteran status, and any other characteristic protected by applicable law.
            - heading "Global Data Privacy Notice for Job Candidates and Applicants" [level=4] [ref=e100]
            - paragraph [ref=e101]:
              - text: Depending on your location, the General Data Protection Regulation (GDPR) and California Consumer Privacy Act (CCPA) may regulate the way we manage the data of job applicants. By submitting your application, you are agreeing to our use and processing of your data as required. Please see our Privacy Notice available at
              - link "www.flexport.com/privacy" [ref=e102] [cursor=pointer]:
                - /url: http://www.flexport.com/privacy
