          - generic [ref=e20]:
            - strong [ref=e23]: "About Glean:"
            - generic [ref=e25]: Glean is the Work AI platform that helps everyone work smarter with AI. What began as the industry’s most advanced enterprise search has evolved into a full-scale Work AI ecosystem, powering intelligent Search, an AI Assistant, and scalable AI agents on one secure, open platform. With over 100 enterprise SaaS connectors, flexible LLM choice, and robust APIs, Glean gives organizations the infrastructure to govern, scale, and customize AI across their entire business - without vendor lock-in or costly implementation cycles.
            - generic [ref=e27]: "At its core, Glean is redefining how enterprises find, use, and act on knowledge. Its Enterprise Graph and Personal Knowledge Graph map the relationships between people, content, and activity, delivering deeply personalized, context-aware responses for every employee. This foundation powers Glean’s agentic capabilities - AI agents that automate real work across teams by accessing the industry’s broadest range of data: enterprise and world, structured and unstructured, historical and real-time. The result: measurable business impact through faster onboarding, hours of productivity gained each week, and smarter, safer decisions at every level."
            - generic [ref=e29]: Recognized by Fast Company as one of the World’s Most Innovative Companies (Top 10, 2025), by CNBC’s Disruptor 50, Bloomberg’s AI Startups to Watch (2026), Forbes AI 50, and Gartner’s Tech Innovators in Agentic AI, Glean continues to accelerate its global impact. With customers across 50+ industries and 1,000+ employees in more than 25 countries, we’re helping the world’s largest organizations make every employee AI-fluent, and turning the superintelligent enterprise from concept into reality.
            - generic [ref=e31]: If you’re excited to shape how the world works, you’ll help build systems used daily across Microsoft Teams, Zoom, ServiceNow, Zendesk, GitHub, and many more - deeply embedded where people get things done. You’ll ship agentic capabilities on an open, extensible stack, with the craft and care required for enterprise trust, as we bring Work AI to every employee, in every company.
          - generic [ref=e32]:
            - strong [ref=e36]: "About the Role:"
            - paragraph [ref=e37]:
              - generic [ref=e38]:
                - text: Glean is building the
                - strong [ref=e39]: horizontal AI platform
                - text: "that powers how employees use AI at work – not just in Glean, but across tools like Copilot, Gemini, ChatGPT, IDEs, and more. We are seeking creative engineers to build this context platform and deliver rich, trustworthy experiences across all of those apps. This team owns the platform experience end‑to‑end: standards and tooling for REST APIs, SDKs and client libraries, agent SDKs and integrations, MCP servers, custom context such as code and memory, and the infrastructure and docs that make it easy to build on Glean. In a rapidly growing startup, this means working across multiple layers of the stack – backend services, developer tools, SDKs, and docs."
            - paragraph [ref=e40]:
              - strong [ref=e42]: "You will:"
            - list [ref=e43]:
              - listitem [ref=e44]: Design, build, and evolve SDKs and client libraries that developers use to integrate with Glean from their own applications and agent frameworks.
              - listitem [ref=e45]: Own and advance agent‑focused tooling and SDKs (including MCP and related integrations) so external frameworks, IDEs, and agents can easily and reliably call into Glean.
              - listitem [ref=e46]: Build custom platform context services and actions such as Code Search, Code Writer, and Memory that power rich experiences across apps.
              - listitem [ref=e47]: Define and maintain standards and conventions for Glean’s public REST APIs (resource design, versioning, errors, deprecations) and provide the OpenAPI schemas, tools, and CI checks that other teams use when building and evolving endpoints.
              - listitem [ref=e48]: Collaborate with Security to design and operate authentication and authorization flows for developer scenarios (e.g., OAuth2/OIDC, dynamic client registration, service‑to‑service auth).
              - listitem [ref=e49]: Design features as reusable platform primitives on top of Glean’s horizontal layers (connectors, security/governance, knowledge graph, memory, model orchestration) so they can be reused by internal teams and partners.
            - paragraph [ref=e50]:
              - strong [ref=e52]: "About you:"
            - list [ref=e53]:
              - listitem [ref=e54]: BA/BS in computer science or a related field, or equivalent practical experience.
              - listitem [ref=e55]: 1+ years of industry software engineering experience.
              - listitem [ref=e56]: Experience building and shipping backend and/or platform systems that are used in production.
              - listitem [ref=e57]: Proficiency in at least one modern backend language (ideally Golang, or strong interest in learning it); experience with TypeScript, Python, and/or Java is a plus.
              - listitem [ref=e58]: Thrive in a customer‑focused, tight‑knit, cross‑functional environment – being a team player and willing to take on whatever is most impactful for the company is a must.
              - listitem [ref=e59]: A proactive and positive attitude to lead, learn, troubleshoot, and take ownership of both small tasks and large features.
              - listitem [ref=e60]: Familiarity with cloud‑native development practices in GCP/AWS/Azure is a plus.
            - paragraph [ref=e61]:
              - strong [ref=e63]: "Location:"
            - list [ref=e64]:
              - listitem [ref=e65]:
                - generic [ref=e66]:
                  - text: This role is hybrid (3-4 days a week in our
                  - strong [ref=e67]: Mountain View
                  - text: office)
            - paragraph [ref=e68]:
              - strong [ref=e70]: "Compensation & Benefits:"
            - paragraph [ref=e71]: The standard base salary range for this position is $140,000 - $265,000 annually. Compensation offered will be determined by factors such as location, level, job-related knowledge, skills, and experience. Certain roles may be eligible for variable compensation, equity, and benefits.
            - paragraph [ref=e72]: We offer a comprehensive benefits package including competitive compensation, Medical, Vision, and Dental coverage, generous time-off policy, and the opportunity to contribute to your 401k plan to support your long-term goals. When you join, you'll receive a home office improvement stipend, as well as an annual education and wellness stipends to support your growth and wellbeing. We foster a vibrant company culture through regular events, and provide healthy lunches daily to keep you fueled and focused.
            - paragraph [ref=e73]: We are a diverse bunch of people and we want to continue to attract and retain a diverse range of people into our organization. We're committed to an inclusive and diverse company. We do not discriminate based on gender, ethnicity, sexual orientation, religion, civil or family status, age, disability, or race.
            - paragraph [ref=e74]: "#LI-HYBRID"
