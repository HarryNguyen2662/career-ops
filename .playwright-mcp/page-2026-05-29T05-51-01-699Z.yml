              - textbox "What AI tools are you currently using today and how are you using them?" [ref=e258]: "Daily workflow: Claude (Anthropic) for architecture review, system design reasoning, and code review at design-doc level. GitHub Copilot for Go, TypeScript, and Python code completion. Cursor for AI-assisted refactoring in my TiMoto codebase. Beyond the tools themselves: I build AI infrastructure. TiMoto runs a vLLM inference stack with PagedAttention to serve contextual AI responses under concurrent load — I've debugged KV cache memory pressure, tuned continuous batching, and traced a production gRPC deadlock to circular resource acquisition. I use LLM-as-a-judge evaluation pipelines to benchmark model outputs systematically. AI tools aren't just in my workflow — they're what I ship."
