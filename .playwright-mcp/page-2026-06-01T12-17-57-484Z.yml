            - generic [ref=e53]:
              - heading "Description" [level=2] [ref=e54]
              - paragraph [ref=e55]:
                - text: Do you want to solve real customer problems through innovative technology? Do you enjoy working on scalable services in a collaborative team environment? Do you want to see your code directly impact millions of customers worldwide?
                - text: At Amazon, we hire the best minds in technology to innovate and build on behalf of our customers. Customer obsession is part of our company DNA, which has made us one of the world's most beloved brands.
                - text: Our Software Development Engineers (SDEs) use modern technology to solve complex problems while seeing their work's impact first-hand. The challenges SDEs solve at Amazon are meaningful and influence millions of customers, sellers, and products globally. We seek individuals passionate about creating new products, features, and services while managing ambiguity in an environment where development cycles are measured in weeks, not years.
                - text: At Amazon, we believe in ownership at every level. As an SDE-I, you'll own the entire lifecycle of your code - from design through deployment and ongoing operations. This ownership mindset, combined with our commitment to operational excellence, ensures we deliver the highest quality solutions for our customers.
                - text: We're looking for curious minds who think big and want to define tomorrow's technology. At Amazon, you'll grow into the high-impact engineer you know you can be, supported by a culture of learning and mentorship. Every day brings exciting new challenges and opportunities for personal growth.
                - text: Key job responsibilities
                - text: "- Collaborate and communicate effectively with experienced cross-disciplinary Amazonians to design, build, and operate innovative products and services that delight our customers, while participating in technical discussions to drive solutions forward"
                - text: "- Design and develop scalable solutions using cloud-native architectures and microservices in a large distributed computing environment"
                - text: "- Participate in code reviews and contribute to technical documentation"
                - text: "- Build and maintain resilient distributed systems that are scalable, fault-tolerant, and cost-effective"
                - text: "- Leverage and contribute to the development of GenAI and AI-powered tools to enhance development productivity while staying current with emerging technologies"
                - text: "- Write clean, maintainable code following best practices and design patterns"
                - text: "- Work in an agile environment practicing CI/CD principles while participating in operational responsibilities including on-call duties"
                - text: "- Demonstrate operational excellence through monitoring, troubleshooting, and resolving production issues"
            - generic [ref=e56]:
              - heading "Basic Qualifications" [level=2] [ref=e57]
              - paragraph [ref=e58]:
                - text: "- Education Requirements (must meet one): Currently enrolled in Bachelor's degree or above in Computer Science, Computer Engineering, Data Science, Information Systems, or related STEM fields OR Completed Bachelor's or Graduate degree in specified fields"
                - text: "- Expected graduation between October 2025 - September 2026, OR graduated within the last 24 months"
                - text: "- Demonstrated experience with at least one general-purpose programming language such as Java, Python, C++, C#, Go, Rust, or TypeScript"
                - text: "- Demonstrated experience one or more of the following: Data structures implementation, Basic algorithm development, Object-oriented design principles"
            - generic [ref=e59]:
              - heading "Preferred Qualifications" [level=2] [ref=e60]
              - paragraph [ref=e61]:
                - text: "- Previous technical internship(s) or demonstrated project experience"
                - text: "- Experience with one or more of the following: AI tools for development productivity, Cloud platforms (preferably AWS), Database systems (SQL and NoSQL), Contributing to open-source projects, Version control systems, Debugging and troubleshooting complex systems"
                - text: "- Strong problem-solving and analytical skills"
                - text: "- Excellent written and verbal communication skills"
                - text: "- Demonstrated ability to learn and adapt to new technologies quickly"
                - text: "- Basic understanding of software development lifecycle (SDLC)"
                - text: Amazon is an equal opportunities employer. We believe passionately that employing a diverse workforce is central to our success. We make recruiting decisions based on your experience and skills. We value your passion to discover, invent, simplify and build. Protecting your privacy and the security of your data is a longstanding top priority for Amazon. Please consult our Privacy Notice (
                - link "https://www.amazon.jobs/en/privacy_page" [ref=e62] [cursor=pointer]:
                  - /url: https://www.amazon.jobs/en/privacy_page
                - text: ) to know more about how we collect, use and transfer the personal data of our candidates.
                - text: Our inclusive culture empowers Amazonians to deliver the best results for our customers. If you have a disability and need a workplace accommodation or adjustment during the application and hiring process, including support for the interview or onboarding process, please visit
                - link "https://amazon.jobs/content/en/how-we-hire/accommodations" [ref=e63] [cursor=pointer]:
