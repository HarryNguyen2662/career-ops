          - generic [ref=e18]:
            - paragraph [ref=e19]:
              - strong [ref=e20]: "Warp: We're Building the Platform for Agentic Development"
            - paragraph [ref=e21]: "Warp began with the vision of reimagining one of the fundamental dev tools — the terminal — to make it more usable and powerful for all developers. As AI has advanced, Warp has evolved beyond its terminal roots into a full agentic development environment: a workbench for dispatching agents to code, deploy, and debug production software."
            - paragraph [ref=e22]: "Today, we have two products: Warp, the agentic development environment born out of the terminal, and Oz, our orchestration platform for running hundreds of cloud agents in parallel. With both products, we’re creating the scaffolding for developers to build their own workflows for working with agents."
            - paragraph [ref=e23]: In Warp, seamlessly switch between running commands, launching agents, and iterating on code with agents— eliminating the need to jump between a terminal and an IDE. It all works with our built-in SOTA agent or top agents like Claude Code, Codex, Gemini CLI, and OpenCode. In Oz, build custom agents that are triggered programmatically, tracked centrally, and are shared across full teams to run agents across organizations without compromising security or reliability. Continue cloud agent runs that were triggered by Oz locally in Warp or on the web with one click.
            - paragraph [ref=e24]: With over 750k active developers at companies including Docker, Ramp, Peloton, and over half of the Fortune 500 and revenue that grew over 44x last year, Warp is one of the fastest-growing startups in the AI development space.
            - paragraph [ref=e25]: "Our mission has remained the same even as AI has advanced: to empower developers to ship better software more quickly, freeing them to focus on the creative and rewarding aspects of their work. If you want to help define what development looks like in the agentic era at a company where your work reaches hundreds of thousands of engineers every day, we'd love to have you."
          - generic [ref=e26]:
            - paragraph [ref=e27]:
              - strong [ref=e28]: As a Software Engineer, you will…
            - list [ref=e29]:
              - listitem [ref=e30]: Participate in all aspects of software development activities, including design, coding, code review, unit/integration testing, bug fixing, and code/API documentation.
              - listitem [ref=e31]: Collaborate closely with the rest of engineering and other stakeholders from our growth, marketing, and product teams to plan features and build a high-quality product that elevates the productivity of all developers.
              - listitem [ref=e32]: Improve Warp's performance and reliability by building new features or polishing existing product parts.
              - listitem [ref=e33]: Prototype ideas and concepts to get quick feedback from internal and external users
              - listitem [ref=e34]: Work across the entire technical stack to ensure users have the most efficient and delightful Warp experience. The features you develop will span all aspects of the user experience, making you an expert on their needs.
              - listitem [ref=e35]: Be a mentor and provide thoughtful feedback to your peers, and build strong personal connections with your teammates!
            - paragraph [ref=e36]:
              - strong [ref=e37]: You may be a good fit if...
            - list [ref=e38]:
              - listitem [ref=e39]: You are passionate about helping developers get more done — would jump at the chance to work on this particular product
              - listitem [ref=e40]: You have amazing engineering chops, but are also product- and user-focused
              - listitem [ref=e41]: You have great communication and collaboration skills
              - listitem [ref=e42]: You’re sensitive to developers’ needs, and can develop warm relationships with developers
              - listitem [ref=e43]: "Bonus:"
              - list [ref=e44]:
                - listitem [ref=e45]: Building native apps in Rust or WASM
                - listitem [ref=e46]: Shell or Linux-programming
                - listitem [ref=e47]: Server-side programming in go
                - listitem [ref=e48]: OpenGL, WebG, or other graphics programming
            - paragraph [ref=e49]: At Warp, we are dedicated to building a diverse, inclusive, and authentic workplace. So if you’re excited about this role, but your past experience doesn’t align perfectly with every qualification in this job description – we encourage you to apply anyways! We are a community of curious learners, and most of us are learning some skills for the first time (like our engineers learning to program Warp in Rust). You might be just the right candidate for this or other roles.
            - paragraph [ref=e50]:
              - generic [ref=e51]:
                - text: "If you're feeling playful, try out our optional hiring challenge and submit your answers with your application:"
                - link "https://github.com/warpdotdev/hiring-challenge" [ref=e52] [cursor=pointer]:
                  - /url: https://github.com/warpdotdev/hiring-challenge
            - paragraph [ref=e53]:
              - strong [ref=e54]: Salary Transparency
            - paragraph [ref=e55]: Warp operates from a place of high trust and transparency around compensation. We state the pay range that best aligns with our understanding of the market and the needs for the open role.
            - paragraph [ref=e56]: When we find the right person, we try to put our best foot forward with an offer that excites you. We consider your skills, the level of experience you bring, and what similar jobs in the market pay, all while ensuring equal pay for equal work at Warp.
            - paragraph [ref=e57]: "Total compensation at Warp consists of: (1) a market-competitive base salary, (2) a generous benefits package, and (3) meaningful equity."
            - paragraph [ref=e58]:
              - strong [ref=e59]: The budgeted compensation amount for this role is targeted at
              - strong [ref=e60]: $165,000 to $260,000
              - strong [ref=e61]: .
            - paragraph [ref=e62]:
              - emphasis [ref=e63]: Exact compensation will vary based on skills and experience.
            - paragraph [ref=e64]: In addition to salary, all employees receive further compensation in the form of equity in the company. This is a meaningful stock option grant with a four-year vesting period and one-year cliff. Your equity is where most of the significant upside potential is. Comparing startup equity is always a bit tricky, so we’re happy to walk you through different valuation scenarios at the offer stage in order to help paint a clearer picture of the upside.
            - paragraph [ref=e65]:
              - strong [ref=e66]: What we offer
            - list [ref=e67]:
              - listitem [ref=e68]: Competitive salary, generous benefits, and meaningful equity
              - listitem [ref=e69]: 100% coverage on medical, dental, and vision benefits for employees (80% coverage for dependents)
              - listitem [ref=e70]: A flexible remote-first culture, with optional office spaces in NYC and SF for folks who want to work together IRL
              - listitem [ref=e71]: Pre-tax FSA and Health Savings Plans
              - listitem [ref=e72]: Pre-tax Commuter Benefit
              - listitem [ref=e73]: 12 company holidays, 20 days of Paid Time Off, and unlimited sick time
              - listitem [ref=e74]: 16 weeks of paid Parental Leave for both birthing and non-birthing parents
              - listitem [ref=e75]: Twice-a-year all company retreats in awesome locations
              - listitem [ref=e76]: A monthly gym and internet stipend
              - listitem [ref=e77]: A company-sponsored 401(k) through Vestwell
              - listitem [ref=e78]: A complimentary OneMedical membership
            - paragraph [ref=e79]:
              - emphasis [ref=e80]: Individuals seeking employment at Warp are considered without regard to race, color, religion, national origin, age, sex, marital status, ancestry, physical or mental disability, veteran status, gender identity, or sexual orientation.
          - generic [ref=e81]:
            - paragraph [ref=e82]:
              - strong [ref=e83]: About Warp
            - paragraph [ref=e84]: We are a company run by product-first builders, building a core product for all developers. We are committed to understanding our users deeply. We will ultimately build the best product and business if that team includes developers and designers from a wide range of backgrounds. The early team comes from Google, Dropbox, Gem, LinkedIn, and Facebook. We are looking for passionate individuals to join us and help bring Warp to the world.
            - paragraph [ref=e85]:
              - text: We value honesty, humility, and pragmatism, and our core product principle is focusing on the user. If you’re interested in learning more about our company values and
