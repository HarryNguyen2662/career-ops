            - article [ref=e93]:
              - heading "Role Description" [level=3] [ref=e94]
              - paragraph [ref=e95]: As an Infrastructure Software Engineer, your role will be crucial in shaping and constructing the robust systems that not only support our current flagship products but also lay the groundwork for the next wave of engineering innovations. From optimizing user experiences across various projects to ensuring seamless scalability and data integrity, you'll be at the forefront of shaping the technological backbone of our platform.
              - paragraph [ref=e96]: Collaborating closely with cross-functional teams, you'll leverage your expertise to tackle audacious challenges and push the boundaries of what's possible. Your contributions will directly impact millions of users, as every line of code you write furthers our mission to revolutionize the way people work and collaborate.
              - paragraph [ref=e97]: Join us in redefining the future, where your passion for building scalable, reliable systems will drive meaningful change on a global scale.
              - paragraph [ref=e98]:
                - text: Our Engineering Career Framework is
                - link "viewable by anyone outside the company" [ref=e99] [cursor=pointer]:
                  - /url: https://dropbox.github.io/dbx-career-framework/
                - text: and describes what’s expected for our engineers at each of our career levels. Check out our blog post on this topic and more
                - link "here" [ref=e100] [cursor=pointer]:
                  - /url: https://dropbox.tech/culture/sharing-our-engineering-career-framework-with-the-world
                - text: .
              - heading "Responsibilities" [level=3] [ref=e101]
              - list [ref=e102]:
                - listitem [ref=e103]: • Build infrastructure capable of managing metadata for hundreds of billions of files, handling hundreds of petabytes of user data, and facilitating millions of concurrent connections.
                - listitem [ref=e104]: • Assist in expanding Dropbox's role as the data-fabric, linking hundreds of millions of applications, devices, and services worldwide, while spearheading efforts to improve interoperability and adaptability across various ecosystems.
                - listitem [ref=e105]: • Measure and optimize Dropbox's analytics platform to maintain its status as one of the most advanced in the industry for extracting meaningful insights from vast data volumes.
                - listitem [ref=e106]: • Collaborate with cross-functional teams to innovate and implement solutions that enhance the performance, reliability, and security of Dropbox's infrastructure, ensuring a seamless experience for users worldwide.
              - paragraph [ref=e107]: On-call work may be necessary occasionally to help address bugs, outages, or other operational issues, with the goal of maintaining a stable and high-quality experience for our customers.
              - heading "Requirements" [level=3] [ref=e108]
              - list [ref=e109]:
                - listitem [ref=e110]: • BS, MS, or PhD in Computer Science or related technical field involving coding (e.g., physics or mathematics), or equivalent technical experience
                - listitem [ref=e111]: • 2+ years of professional software development experience
                - listitem [ref=e112]: • Demonstrated experience in building and managing large-scale, multi-threaded, and geographically distributed backend systems
                - listitem [ref=e113]: • Proficient in programming and debugging across a range of languages such as Python, Go, C/C++, or Java
                - listitem [ref=e114]: • Experience working with operating system internals, filesystems, databases, networks, and compilers
                - listitem [ref=e115]: • Ability to independently execute tasks at hand
              - heading "Preferred Qualifications" [level=3] [ref=e116]
              - list [ref=e117]:
                - listitem [ref=e118]: • Familiarity with Semaphores and Mutexes
              - heading "Compensation" [level=3] [ref=e119]
              - paragraph [ref=e120]: Poland Pay Range
              - paragraph [ref=e121]: 212 500 zł—287 500 zł PLN
              - paragraph [ref=e122]:
                - text: Dropbox applies increased tax deductible costs to remuneration earned by certain qualifying employees (to the extent an employee will be involved in the creation of the software as an “author”) for the transfer of copyrights, in accordance with the relevant provisions of the Personal Income Tax Act.
                - text: The range(s) listed above is the expected annual salary/OTE (On-Target Earnings) for this role, subject to change. Please note, OTE are for sales roles only.
                - text: Salary/OTE is just one component of Dropbox’s total rewards package. All regular employees are also eligible for the corporate bonus program or a sales incentive (target included in OTE) as well as stock in the form of Restricted Stock Units (RSUs).
                - text: Dropbox is a
                - link "Virtual First" [ref=e123] [cursor=pointer]:
                  - /url: /en/virtual-first/
                - text: company and is open to hiring candidates in all authorized locations.
              - paragraph [ref=e124]:
                - text: Read more about our benefits
                - link "here" [ref=e125] [cursor=pointer]:
                  - /url: /en/poland/
                - text: .
              - heading "Company Description" [level=3] [ref=e126]
              - paragraph [ref=e127]: Dropbox isn’t just a workplace—it’s a living lab for designing a more enlightened way of working. We’re a global community of bold visionaries and resourceful doers shaping the future of Dropbox and, in turn, the future of work. Our Virtual First model combines the autonomy of a distributed workplace with the power of human connection, creating space for meaningful work and lasting relationships. With a startup mindset and enterprise-level opportunities, we expect Dropbox employees to think critically, stay curious, and use modern tools, including AI, to improve how work gets done. Here, you can be who you are and grow into who you’re meant to be. You own your impact, helping make work more intuitive, joyful, and human for yourself and hundreds of millions of people worldwide. If you’re ready to push boundaries and challenge yourself, Dropbox is ready for you.
              - heading "Team Description" [level=3] [ref=e128]
              - paragraph [ref=e129]: The Dropbox Engineering Team develops the technology, platforms, and products that create more enlightened ways of working for hundreds of millions of people. Customers rely on Dropbox to manage, share, and collaborate on content seamlessly—our engineering makes that easier and more intuitive than ever before.Our platform features a robust systems software layer that stores and processes exabytes of data, and a suite of growing services that enhance core products like our sharing and sync engine. We’re also driving innovation with new offerings such as Dash, our AI-powered knowledge management engine. Our infrastructure spans high-performance servers and cutting-edge components across multiple data centers worldwide, ensuring reliability, speed, and scalability at a global scale. We think like a startup but build for an enterprise, exploring new possibilities that transform how people work. If you're excited about turning complex technical challenges into intuitive solutions at scale, join our Engineering team.
              - heading "Virtual First" [level=3] [ref=e130]:
                - strong [ref=e131]: Virtual First
              - paragraph [ref=e132]: Dropbox’s Virtual First way of working is designed to help people do their best work with flexibility, autonomy, and connection. Day to day, teams work remotely with nonlinear schedules and core collaboration hours that support deep focus and individual working styles. We prioritize asynchronous communication to improve clarity, respect deep work time, and reduce unnecessary meetings. While remote work is the primary experience for our employees, we also prioritize intentional, in-person connection. We bring teams together through regular team gatherings, on-demand workspaces, and Dropbox Neighborhood events in order to strengthen team cohesion, foster creativity, and enhance momentum. Virtual First is built to provide the same access to opportunity, growth, and impact for everyone, regardless of location.
              - paragraph [ref=e133]: This role requires travel to offsites and various other team gatherings (approximately 5-10% of the year or 2-3 days per quarter). We provide advance notice when possible and encourage candidates to discuss any accommodation needs during the interview process.
              - paragraph [ref=e134]:
                - text: Dropbox supports responsible use of AI for preparation, but misrepresentation of skills or experience is not permitted. See our
                - link "AI Principles" [ref=e135] [cursor=pointer]:
                  - /url: https://www.dropbox.com/ai-principles
                - text: .
                - text: Dropbox is an equal opportunity employer. We are a welcoming place for everyone, and we do our best to make sure all people feel supported and connected at work.
