            - heading "Software Engineer, Financial Platform" [level=1] [ref=e14]
            - generic [ref=e15]:
              - img [ref=e16]
              - generic [ref=e18]: New York, NY, USA; San Francisco, CA, USA; Seattle, WA, USA
          - button "Apply" [ref=e19] [cursor=pointer]
        - generic [ref=e20]:
          - generic [ref=e21]:
            - heading "About the role" [level=2] [ref=e22]:
              - strong [ref=e24]: About the role
            - paragraph [ref=e25]: We are looking for a Software Engineer to help build our new financial platform that is highly reliable, scalable, and will serve as the backbone for Chime. This platform will power the most important financial activities that millions of Chime members undertake every day. You will ensure that we build the highest levels of trust with our members by making our platform lightning-fast, available, secure, resilient and auditable. This is an exciting opportunity to be an invaluable member of a strategically important initiative for Chime.
            - paragraph [ref=e26]: The base salary offered for this role and level of experience will begin at $133,000 and up to $184,000. Full-time employees are also eligible for a bonus, competitive equity package, and benefits. The actual base salary offered may be higher, depending on your location, skills, qualifications, and experience.
            - heading "In this role, you can expect to" [level=2] [ref=e27]:
              - strong [ref=e29]: In this role, you can expect to
            - list [ref=e30]:
              - listitem [ref=e31]: Design, develop, test, and deploy components of a new financial platform
              - listitem [ref=e32]: Deliver secure, reliable, and high-performance infrastructure and APIs
              - listitem [ref=e33]: Work with our infrastructure engineering team to minimize the operational overhead of production systems you deploy
              - listitem [ref=e34]: Develop thoroughly tested code and conduct quality assurance on all new code alongside our QA team
              - listitem [ref=e35]: Learn and execute on agile methodologies, follow test driven development approach
              - listitem [ref=e36]: Engineers are required to participate in on-call rotation. Being on call may include responding to incidents outside of regular working hours when necessary.
            - heading "To thrive in this role, you have" [level=2] [ref=e37]:
              - strong [ref=e39]: To thrive in this role, you have
            - list [ref=e40]:
              - listitem [ref=e41]: Must have experience in Go
              - listitem [ref=e42]: Experience in additional backend languages such as Ruby, Java and Python is preferred
              - listitem [ref=e43]: Have 4+ years of engineering experience
              - listitem [ref=e44]: Have contributed to the development of backend systems
              - listitem [ref=e45]: Experience in payment processing systems
              - listitem [ref=e46]: Take a rigorous approach to testing backed development
              - listitem [ref=e47]: Experience with AWS or other cloud platforms, Cloud Native technology, No-SQL Databases as a bonus!
              - listitem [ref=e48]: Have an understanding of architectural patterns of large, mission-critical production services as a bonus!
              - listitem [ref=e49]: Have worked in continuous integration/deployment environments as a bonus!
              - listitem [ref=e50]: "Please note: If you are located in Seattle, you will be required to onboard in person at our SF HQ + occasional business travel."
            - paragraph [ref=e51]: "#LI-Onsite #LI-GC1"
          - generic [ref=e52]:
            - heading "A little about us" [level=2] [ref=e53]:
              - strong [ref=e55]: A little about us
            - paragraph [ref=e56]: At Chime, we believe that everyone can achieve financial progress. We created Chime—a financial technology company, not a bank*—on the premise that core banking services should be helpful, easy, and free. Through our user-friendly tools and intuitive platforms, we empower our members to take control of their finances and work towards their goals. Whether it's starting a savings account, purchasing a first car or home, launching a business, or pursuing higher education, we're proud to have helped millions unlock their financial potential.
            - paragraph [ref=e57]: "We're a team of problem solvers, dreamers, and builders with one shared obsession: our members. From day one, Chimers have worked tirelessly to out-hustle and out-execute competitors to bring our mission to life. Their grit and determination inspire us to work harder every day to deliver the very best experience possible. We each bring an owner's mindset to our work, refusing to be outdone and holding ourselves accountable to meet and exceed the highest bars for our teams, our company, and our members."
            - paragraph [ref=e58]: We believe in being bold, dreaming big, and taking risks, while also working together, embracing our diverse perspectives, and giving each other honest feedback. Our culture remains deeply entrepreneurial, encouraging every Chimer to see themselves as stewards of our mission to help everyday Americans unlock their financial progress.
            - paragraph [ref=e59]: We know that to achieve our mission, we must earn and keep people's trust—so we hold ourselves to the highest standards of integrity in everything we do. These aren't just words on a wall—our values are embedded in every aspect of our business, serving as a north star that guides us as we work to help millions achieve their financial potential.
            - paragraph [ref=e60]: Because if we don't—who will?
            - paragraph [ref=e61]: "*Chime is a financial technology company, not a bank. Banking services provided by The Bancorp Bank, N.A. or Stride Bank, N.A., Members FDIC."
            - heading "What we offer for our full-time, regular employees" [level=2] [ref=e62]:
              - strong [ref=e64]: What we offer for our full-time, regular employees
            - list [ref=e65]:
              - listitem [ref=e66]: 🏢 Our in-office work policy is designed to keep you connected - with four days a week in the office and Fridays from home for those near one of our offices, plus team and company-wide events depending on location. Whether you’re coming in regularly or are part of our fully remote program, you’ll stay engaged with your work and teammates.
              - listitem [ref=e67]: 💻 In-office perks including backup child, elder, and/or pet care, plus a subsidized commuter benefit to support your regular commute
              - listitem [ref=e68]: 💰 Competitive salary based on experience
              - listitem [ref=e69]: ✨ 401k match plus great medical, dental, vision, life, and disability benefits
              - listitem [ref=e70]: 🏝 Generous vacation policy and company-wide Chime Days, bonus company-wide paid days off
              - listitem [ref=e71]: 🫂 1% of your time off to support local community organizations of your choice
              - listitem [ref=e72]: 👟 Annual wellness stipend to use towards eligible wellness related expenses
              - listitem [ref=e73]: 👶 Up to 24 weeks of paid parental leave for birthing parents and 12 weeks of paid parental leave for non-birthing parents
              - listitem [ref=e74]: 👪 Access to Maven, a family planning tool, with $15k lifetime reimbursement for egg freezing, fertility treatments, adoption, and more.
              - listitem [ref=e75]: 🎉 In-person and virtual events to connect with your fellow Chimers—think cooking classes, guided meditations, music festivals, mixology classes, paint nights, etc., and delicious snack boxes, too!
              - listitem [ref=e76]: 💚 A challenging and fulfilling opportunity to join one of the most experienced teams in FinTech and help millions unlock financial progress
            - paragraph [ref=e77]: We know that great work can’t be done without a diverse team and inclusive environment. That’s why we specifically look for individuals of varying strengths, skills, backgrounds, and ideas to join our team. We believe this gives us a competitive advantage to better serve our members and helps us all grow as Chimers and individuals.
            - paragraph [ref=e78]:
              - generic [ref=e79]:
                - text: "Chime is proud to be an Equal Opportunity Employer. We consider qualified applicants without regard to race, color, ancestry, religion, sex, national origin, sexual orientation, gender identity, age, marital or family status, disability, genetic information, veteran status, or any other legally protected basis under provincial, federal, state, and local laws, regulations, or ordinances. We will also consider qualified applicants with criminal histories in a manner consistent with the requirements of state and local laws, including the San Francisco Fair Chance Ordinance, Cook County Ordinance, NYC Fair Chance Act, and the LA City Fair Chance Ordinance, and consistent with Canadian provincial and federal laws. If you have a disability or special need that requires accommodation during any stage of the application process, please contact:"
                - link "benefits@chime.com" [ref=e81] [cursor=pointer]:
                  - /url: mailto:benefits@chime.com
                - text: .
            - paragraph [ref=e82]:
              - generic [ref=e83]:
                - text: To learn more about how Chime collects and uses your personal information during the application process, please see the
                - link "Chime Applicant Privacy Notice." [ref=e84] [cursor=pointer]:
                  - /url: https://www.chime.com/careers/chime-applicant-privacy-notice/
