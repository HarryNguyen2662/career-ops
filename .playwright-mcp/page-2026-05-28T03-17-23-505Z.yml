      - generic [ref=e18]:
        - heading "About D3:" [level=1] [ref=e19]
        - paragraph [ref=e20]:
          - link "D3" [ref=e21] [cursor=pointer]:
            - /url: https://d3.inc/
          - text: is building the world’s first purpose-built blockchain for
          - link "DomainFi" [ref=e22] [cursor=pointer]:
            - /url: https://domainfi.com/
            - strong [ref=e23]: DomainFi
          - text: —bringing domain tokenization and DeFi primitives to a massive, rapidly growing
          - strong [ref=e24]: $350B+ real-world asset class
          - text: . We’re revolutionizing how existing and future domain names are owned, traded, and leveraged in the digital economy.
        - paragraph [ref=e25]:
          - text: Our elite team is stacked with
          - strong [ref=e26]: industry veterans
          - text: who have spent
          - strong [ref=e27]: the last three decades shaping the internet
          - text: ", from pioneering domain name monetization to architecting key internet protocols to launching and running major TLDs like"
          - strong [ref=e28]: .xyz, .inc, .tv, and .link
          - text: . With a proven track record of innovation and success, we’re now redefining what’s possible in the domain space.
        - paragraph [ref=e29]:
          - text: We recently closed a
          - link "$25M Series A led by Paradigm" [ref=e30] [cursor=pointer]:
            - /url: https://d3.inc/blog/news/d3-raises-25m-to-revolutionize-domains-announces-launch-of-doma-protocol/
            - strong [ref=e31]: $25M Series A led by Paradigm
          - text: "- one of the best investors in the industry. This will help fuel our mission to bring domains fully on-chain and unlock new financial possibilities for one of the internet’s most valuable asset classes."
        - paragraph [ref=e32]: We’re based in Los Angeles, with team members all over the world. We’re looking for driven, talented builders to help build a trillion-dollar DomainFi economy. Join us!
        - heading "Job Overview:" [level=1] [ref=e33]
        - paragraph [ref=e34]: This is a hybrid role in Los Angeles where you’ll help build the next generation of backend systems that power our Web2/Web3 domain registrar and marketplaces. As a Backend Engineer (Entry Level), you’ll work alongside experienced engineers to design and implement backend services, learn modern web and blockchain technologies, and contribute to real products that bridge traditional and decentralized internet infrastructure.
        - paragraph [ref=e35]
        - paragraph [ref=e36]: This role is a great fit for recent graduates or early-career engineers who want to grow quickly in a fast-paced startup environment.
        - heading "Key Responsibilities:" [level=1] [ref=e37]
        - list [ref=e38]:
          - listitem [ref=e39]: Work with the product and engineering teams to understand requirements and turn them into backend features.
          - listitem [ref=e40]: Help design, implement, and maintain backend services that power our registrar platform and domain marketplace.
          - listitem [ref=e41]: Contribute to backend systems that connect with blockchain protocols.
          - listitem [ref=e42]: Assist in building payment integrations that support both traditional and crypto payments.
          - listitem [ref=e43]: Write clean, testable code and participate in code reviews.
          - listitem [ref=e44]: Debug, fix, and improve existing codebases with mentorship from senior engineers.
          - listitem [ref=e45]: Stay curious and learn about new tools, frameworks, and best practices in web and blockchain development.
        - heading "Qualifications:" [level=1] [ref=e46]
        - list [ref=e47]:
          - listitem [ref=e48]: Bachelor’s degree in Computer Science, Software Engineering, or a related field (or equivalent practical experience).
          - listitem [ref=e49]: 0–2 years of professional experience in backend development (internships, projects, or open-source contributions count).
          - listitem [ref=e50]: Familiarity with at least one backend programming language (e.g., JavaScript/Node.js, Python, or similar).
          - listitem [ref=e51]: Basic knowledge of databases such as MySQL or PostgreSQL.
          - listitem [ref=e52]: Understanding of version control (Git) and collaborative development.
          - listitem [ref=e53]: Problem-solving mindset, eagerness to learn, and ability to work in a team.
          - listitem [ref=e54]: Interest in Web3/blockchain technologies is a plus, but not required—you’ll learn here!
        - heading "Nice to haves:" [level=1] [ref=e55]
        - list [ref=e56]:
          - listitem [ref=e57]: Exposure to cloud platforms (AWS, Google Cloud, Digital Ocean).
          - listitem [ref=e58]: Familiarity with frameworks like NestJS or GraphQL.
          - listitem [ref=e59]: Previous projects or coursework involving blockchain, distributed systems, or domain registries.
        - paragraph [ref=e60]
        - heading "Why D3, Why Now?" [level=1] [ref=e61]
        - paragraph [ref=e62]:
          - strong [ref=e63]: Ground-Floor Growth, Learning, and Impact
          - text: ": D3 is your chance to dive headfirst into an ultra-early-stage company where every move you make truly matters. You’ll have the opportunity to sharpen your skills, expand your expertise, and shape the foundation of something groundbreaking. Almost everything we’re building today at D3 is “zero-to-one,” meaning you’ll be among the first to craft, refine, and launch key initiatives that define our future success."
        - paragraph [ref=e64]:
          - strong [ref=e65]: Strong, Proven Leadership
          - text: ": At D3, you’ll work alongside industry visionaries who have been there, done that, and are ready to do it again—only bigger. Our leadership team brings veteran industry experience, sharp insights, and a relentless drive to do big things across every function at D3. You’ll gain invaluable mentorship, develop a high-impact mindset, and be challenged to grow in ways you never imagined."
        - paragraph [ref=e66]:
          - strong [ref=e67]: Unique Market Positioning
          - text: – We’re pioneering at the intersection of internet infrastructure, real-world assets, and blockchain communities, creating solutions that redefine what’s possible in Web3. If you want to push boundaries, solve complex problems, and be part of a team that’s shaping the future of the Internet, D3 is the place to do it.
