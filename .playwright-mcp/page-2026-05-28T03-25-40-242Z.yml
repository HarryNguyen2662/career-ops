          - heading "About AppLovin" [level=3] [ref=e21]:
            - strong [ref=e23]: About AppLovin
          - paragraph [ref=e24]:
            - text: "AppLovin makes technologies that help businesses of every size connect to their ideal customers. The company provides end-to-end software and AI solutions for businesses to reach, monetize and grow their global audiences. For more information about AppLovin, visit:"
            - link "www.applovin.com" [ref=e25] [cursor=pointer]:
              - /url: http://www.applovin.com/
            - text: .
          - paragraph [ref=e26]: To deliver on this mission, our global team is composed of team members with life experiences, backgrounds, and perspectives that mirror our developers and customers around the world. At AppLovin, we are intentional about the team and culture we are building, seeking candidates who are outstanding in their own right and also demonstrate their support of others.
          - paragraph [ref=e27]:
            - text: Fortune recognizes AppLovin as one of the Best Workplaces in the Bay Area, and the company has been a Certified Great Place to Work for the last four years (2021-2024). Check out the rest of our awards
            - link "HERE" [ref=e28] [cursor=pointer]:
              - /url: https://www.applovin.com/jobs/
            - text: .
        - generic [ref=e29]:
          - heading "A Day in the Life" [level=3] [ref=e30]
          - paragraph [ref=e31]: As a member of our backend software engineering team, you’ll solve technical challenges, including upgrading and implementing state-of-the-art software infrastructure. The team builds a high-performance, high availability, globally distributed ecosystem platform of services that in turn provide the foundation for rapid development of novel new systems that integrate into that ecosystem and improve it
          - paragraph [ref=e32]: Our backend systems handle billions of requests per day, and work on our mediation platform responsible for our header bidding solution, creating high-availability low-latency systems that are distributed across multiple data centers.
          - paragraph [ref=e33]
          - heading "The Impact You’ll Make" [level=3] [ref=e34]
          - list [ref=e35]:
            - listitem [ref=e36]:
              - paragraph [ref=e37]: Design, develop, and maintain large-scale distributed systems
            - listitem [ref=e38]:
              - paragraph [ref=e39]: Collaborate with various engineering teams to meet a wide range of technological challenges
            - listitem [ref=e40]:
              - paragraph [ref=e41]: Work closely with our product team to contribute and influence the roadmap of our products and technologies
            - listitem [ref=e42]:
              - paragraph [ref=e43]: Influence and inspire team members
          - paragraph [ref=e44]
          - heading "Who You Are" [level=3] [ref=e45]
          - list [ref=e46]:
            - listitem [ref=e47]:
              - paragraph [ref=e48]: Have 0-2+ years of experience and a minimum of a BS and/or MS in Computer Science
            - listitem [ref=e49]:
              - paragraph [ref=e50]: Have excellent knowledge of computer science fundamentals including data structures, algorithms, and coding
            - listitem [ref=e51]:
              - paragraph [ref=e52]: Professional experience with C++ and/or Java is a plus
            - listitem [ref=e53]:
              - paragraph [ref=e54]: Experience independently creating and maintaining projects
