      - main [ref=e92]:
        - generic [ref=e93]:
          - generic [ref=e95]:
            - paragraph [ref=e96]: CSQ227R47
            - paragraph [ref=e97]: "The AI Forward Deployed Engineering (AI FDE) team is a highly specialized customer-facing AI team at Databricks. We deliver professional services engagements to help our customers build and productionize first-of-its-kind AI applications. We work cross-functionally to shape long-term strategic priorities and initiatives alongside engineering, product, and developer relations, as well as support internal subject matter expert (SME) teams. We view our team as an ensemble: we look for individuals with strong, unique specializations to improve the overall strength of the team. This team is the right fit for you if you love working with customers, teammates, and fueling your curiosity for the latest trends in GenAI, LLMOps, and ML more broadly. Open to remote locations."
            - paragraph [ref=e98]:
              - strong [ref=e99]: "The impact you will have:"
            - list [ref=e100]:
              - listitem [ref=e101]:
                - text: Develop cutting-edge GenAI solutions, incorporating the latest techniques from our
                - link "Mosaic AI Research" [ref=e102] [cursor=pointer]:
                  - /url: https://www.databricks.com/research/mosaic
                - text: to solve customer problems
              - listitem [ref=e103]: Own production rollouts of consumer and internally facing GenAI applications
              - listitem [ref=e104]: Serve as a trusted technical advisor to customers across a variety of domains
              - listitem [ref=e105]:
                - text: Present at conferences such as
                - link "Data + AI Summit" [ref=e106] [cursor=pointer]:
                  - /url: https://www.databricks.com/dataaisummit
                - text: ", recognized as a thought leader internally and externally"
              - listitem [ref=e107]: Collaborate cross-functionally with the product and engineering teams to influence priorities and shape the product roadmap
            - paragraph [ref=e108]:
              - strong [ref=e109]: "What we look for:"
            - list [ref=e110]:
              - listitem [ref=e111]: Experience building GenAI applications, including RAG, multi-agent systems, Text2SQL, fine-tuning, etc., with tools such as HuggingFace, LangChain, and DSPy
              - listitem [ref=e112]: Expertise in deploying production-grade GenAI applications, including evaluation and optimizations
              - listitem [ref=e113]: Extensive years of hands-on industry data science experience, leveraging common machine learning and data science tools, i.e. pandas, scikit-learn, PyTorch, etc.
              - listitem [ref=e114]: Experience building production-grade machine learning deployments on AWS, Azure, or GCP
              - listitem [ref=e115]: Graduate degree in a quantitative discipline (Computer Science, Engineering, Statistics, Operations Research, etc.) or equivalent practical experience
              - listitem [ref=e116]: Experience communicating and/or teaching technical concepts to non-technical and technical audiences alike
              - listitem [ref=e117]: Passion for collaboration, life-long learning, and driving business value through AI
              - listitem [ref=e118]: "[Preferred] Experience using the Databricks Intelligence Platform and Apache Spark™ to process large-scale distributed datasets"
