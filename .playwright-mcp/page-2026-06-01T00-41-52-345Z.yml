              - paragraph [ref=e59]: For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role.
            - paragraph [ref=e60]: "Annual Salary:"
