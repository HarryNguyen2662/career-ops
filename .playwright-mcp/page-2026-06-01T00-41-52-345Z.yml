        - generic [ref=e20]:
          - generic [ref=e21]:
            - heading "About Anthropic" [level=2] [ref=e22]:
              - strong [ref=e23]: About Anthropic
            - paragraph [ref=e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=e25]:
            - heading "About the role" [level=2] [ref=e26]:
              - strong [ref=e27]: About the role
            - paragraph [ref=e28]: "The RL Velocity team owns the efficiency and reliability of our RL Science stack - the infrastructure, tooling, and systems that let researchers iterate quickly on training runs. As a Research Engineer on the team, you'll build and improve the core platform that underpins how we do RL at Anthropic, removing bottlenecks that slow down research and making it easier for the broader org to ship better models faster. This is high-leverage work: small improvements to velocity compound across every researcher and every run."
            - heading "Responsibilities" [level=2] [ref=e29]:
              - strong [ref=e30]: Responsibilities
            - list [ref=e31]:
              - listitem [ref=e32]: Build and improve the RL training infrastructure that researchers depend on day-to-day
              - listitem [ref=e33]: "Identify and remove bottlenecks across the RL stack: debugging, profiling, and rearchitecting where needed"
              - listitem [ref=e34]: Partner closely with researchers and with adjacent engineering teams (inference, sandboxing, and many more) to understand pain points and ship tooling that makes them faster
              - listitem [ref=e35]: Own the reliability and performance of research runs end-to-end
              - listitem [ref=e36]: Contribute to design decisions that shape how Anthropic does RL at scale
            - heading "You may be a good fit if you" [level=2] [ref=e37]:
              - strong [ref=e38]: You may be a good fit if you
            - list [ref=e39]:
              - listitem [ref=e40]: Have strong software engineering fundamentals and a track record of building performant, reliable systems
              - listitem [ref=e41]: Have worked on ML infrastructure, distributed systems, or research tooling
              - listitem [ref=e42]: Care about enabling other people's work and find leverage through platforms rather than individual experiments
              - listitem [ref=e43]: Are comfortable operating across the stack, from low-level performance work to RL algorithms
              - listitem [ref=e44]: Have a bias toward shipping and iterating quickly, with a mix of high agency and low ego
            - heading "Strong candidates may also have" [level=2] [ref=e45]:
              - strong [ref=e46]: Strong candidates may also have
            - list [ref=e47]:
              - listitem [ref=e48]: Experience with large-scale distributed training (RL, pre-training, or post-training)
              - listitem [ref=e49]: Familiarity with JAX, PyTorch, or similar ML frameworks
              - listitem [ref=e50]: A track record of operating at the edge of research and infra in a fast-moving environment
            - paragraph [ref=e51]:
              - strong [ref=e52]: "Deadline to apply:"
              - text: None. Applications will be reviewed on a rolling basis.
          - generic [ref=e54]:
