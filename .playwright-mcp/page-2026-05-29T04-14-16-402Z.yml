                    - /url: https://www.linkedin.com/feed/update/urn:li:activity:7391576181009018883/
            - paragraph [ref=e54]: Giga builds AI agents trusted by the largest B2C companies in the world. Industry leaders like DoorDash trust Giga with their most complex support and operations workflows across voice, chat, and email. If being a part of this resonates with you, please apply!
            - paragraph [ref=e55]
            - heading "The Role" [level=1] [ref=e56]:
              - strong [ref=e57]: The Role
            - paragraph [ref=e58]: We're looking for new grad engineers to help build the systems that power our AI agents. You'll work across the backend, from data pipelines and integrations to agent infrastructure, shipping features alongside experienced engineers.
            - paragraph [ref=e59]: This is a role where you'll contribute to real problems from day one. We expect you to ramp up quickly, take ownership of your work, and operate with increasing independence as you learn the codebase.
            - paragraph [ref=e60]
            - heading "What You'll Work On" [level=1] [ref=e61]:
              - strong [ref=e62]: What You'll Work On
            - paragraph [ref=e63]: "You'll contribute to projects across our stack. Some examples:"
            - list [ref=e64]:
              - listitem [ref=e65]:
                - paragraph [ref=e66]: "Atlas: Building features for our AI assistant: charts and alerts in Slack, natural language queries, and expanding Atlas to manage platform resources"
              - listitem [ref=e67]:
                - paragraph [ref=e68]: "Activity Stream: Log visualization with filters, timestamps, and frequency charts to give visibility into agent behavior"
              - listitem [ref=e69]:
                - paragraph [ref=e70]: "Dynamic knowledge: Adding time-based knowledge (like ongoing incidents) that auto-updates from sources like status pages"
              - listitem [ref=e71]:
                - paragraph [ref=e72]: "Agent memory: Conversation awareness and recent interaction lookups so agents remember context across sessions"
            - paragraph [ref=e73]: You'll be paired with senior engineers on larger initiatives while also owning smaller projects end-to-end as you ramp up.
