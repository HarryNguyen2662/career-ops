            - heading "About Giga" [level=1] [ref=e41]:
              - strong [ref=e42]: About Giga
            - paragraph [ref=e43]: Giga has recently raised a $61M Series A and has several paying customers, including DoorDash. We’re building the next generation of customer experience — real-time AI agents that can understand emotion, resolve issues instantly, and scale across the world’s largest enterprises.
            - paragraph [ref=e44]:
              - text: It’s an exciting inflection point for the company. While we have been successful, we have larger ambitions. Our goal is to become the go-to AI platform for all enterprise automation, powered by our voice superintelligence.
              - strong [ref=e45]
              - text: To achieve this, we need more great engineers.
            - paragraph [ref=e46]: "The work affects millions of people every day and our engineers have autonomy and make true impact. This opportunity is unique because we have brilliant founders, have found commercial success, and see a clear path to becoming a generational company. Some further info about us:"
            - list [ref=e47]:
