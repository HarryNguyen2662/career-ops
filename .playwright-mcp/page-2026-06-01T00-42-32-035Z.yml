  - heading "Backend Engineer, AI Security" [level=1] [ref=e45]
  - generic [ref=e53]:
    - generic [ref=e54]:
      - generic [ref=e55]:
        - heading "Who we are" [level=2] [ref=e56]
        - heading "About Stripe" [level=3] [ref=e57]
        - paragraph [ref=e58]: Stripe is a financial infrastructure platform for businesses. Millions of companies—from the world’s largest enterprises to the most ambitious startups—use Stripe to accept payments, grow their revenue, and accelerate new business opportunities. Our mission is to increase the GDP of the internet, and we have a staggering amount of work ahead. That means you have an unprecedented opportunity to put the global economy within everyone’s reach while doing the most important work of your career.
        - heading "About the team" [level=3] [ref=e59]
        - paragraph [ref=e60]: AI is moving fast and Stripe is moving fast to adopt it. But we need to make sure we do all of this safely, and for most of these tools enterprise-grade security isn't just available off the shelf. That's where the AI security team comes in - we are responsible for building and partnering to create the right security primitives to enable Stripe to move fast safely.
        - paragraph [ref=e61]: This is a team that will be working in the low level components of our AI stack so both infrastructure and security experience are pluses. This space is moving fast so being comfortable with ambiguity and changes in priority are a must.
        - paragraph [ref=e62]: This is a foundational role — you'd be the first engineer on the team.
        - heading "What you’ll do" [level=2] [ref=e63]
        - paragraph [ref=e64]: Engineers on this team will do a mixture of partnering and advising with teams building AI infrastructure and products, and building security infrastructure primitives for AI.
        - paragraph [ref=e65]: One of our major focuses will be building a security tooling layer that sits in the inference path, providing detection and protection against AI specific threats like prompt injection, jailbreaks, and tool misuse.
        - heading "Responsibilities" [level=3] [ref=e66]
        - list [ref=e67]:
          - listitem [ref=e68]: Build security frameworks integrated with our core AI infrastructure
          - listitem [ref=e69]: Design and implement defenses against AI specific threats like prompt injection and jailbreaks
          - listitem [ref=e70]: Collaborate with other engineering teams to ensure Stripe's AI infrastructure and products are built securely
          - listitem [ref=e71]: Support other engineering teams in integrating security primitives
          - listitem [ref=e72]: Uphold our high engineering standards and improve our codebase and processes
          - listitem [ref=e73]: Design and build systems that help define the state of the art for AI security
        - heading "Who you are" [level=2] [ref=e74]
        - paragraph [ref=e75]: We’re looking for someone who meets the minimum requirements to be considered for the role. If you meet these requirements, you are encouraged to apply. The preferred qualifications are a bonus, not a requirement.
        - heading "Minimum requirements" [level=3] [ref=e76]
        - list [ref=e77]:
          - listitem [ref=e78]: 5+ years of software development experience
          - listitem [ref=e79]: Experience independently designing and developing medium to large projects
          - listitem [ref=e80]: Experience working collaboratively across multiple engineering teams
          - listitem [ref=e81]: Experience writing high quality code in a major programming language
          - listitem [ref=e82]: Ability to drive clear next steps when working in an ambiguous environment
          - listitem [ref=e83]: Ability to think creatively and reason clearly in a complex problem domain
        - heading "Preferred qualifications" [level=3] [ref=e84]
        - list [ref=e85]:
          - listitem [ref=e86]: Experience developing, deploying, and maintaining reliable infrastructure systems
          - listitem [ref=e87]: Experience in security engineering
          - listitem [ref=e88]: Experience building AI agents or LLM-based systems
      - generic [ref=e89]:
        - generic [ref=e90]:
          - heading "Hybrid work at Stripe" [level=1] [ref=e92]
          - paragraph [ref=e94]: This role is available either in an office or a remote location (35+ miles or 56+ km from a Stripe office).
        - generic [ref=e95]:
          - heading "In-office expectations" [level=1] [ref=e97]
          - generic [ref=e98]: Office-assigned Stripes spend at least 50% of the time in a given month in their local office or with users. This hits a balance between bringing people together for in-person collaboration and learning from each other, while supporting flexibility about how to do this in a way that makes sense for individuals and their teams.
        - generic [ref=e99]:
          - heading "Working remotely at Stripe" [level=1] [ref=e101]
          - generic [ref=e102]: A remote location is defined as being 35 miles (56 kilometers) or more from one of our offices. While you would be welcome to come into the office for team/business meetings, on-sites, meet-ups, and events, our expectation is you would regularly work from home rather than a Stripe office. Stripe does not cover the cost of relocating to a remote location. We encourage you to apply for roles that match the location where you currently live or plan to live.
      - generic [ref=e103]:
        - heading "Pay and benefits" [level=1] [ref=e105]
        - generic [ref=e106]:
          - paragraph [ref=e107]: The annual US base salary range for this role is $190,400 - $285,600. For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role. This salary range may be inclusive of several career levels at Stripe and will be narrowed during the interview process based on a number of factors, including the candidate’s experience, qualifications, and location. Applicants interested in this role and who are not located in the US may request the annual salary range for their location during the interview process.
          - paragraph [ref=e108]: "Additional benefits for this role may include: equity, company bonus or sales commissions/bonuses; 401(k) plan; medical, dental, and vision benefits; and wellness stipends."
