            - generic [ref=e117]:
              - paragraph [ref=e118]: It all started with an idea at Block in 2013. Initially built to take the pain out of peer-to-peer payments, Cash App has gone from a simple product with a single purpose to a dynamic ecosystem, developing unique financial products, including Afterpay/Clearpay, to provide a better way to send, spend, invest, borrow and save to our 50+ million monthly active customers. We want to redefine the world's relationship with money to make it more relatable, instantly available, and universally accessible.
              - paragraph [ref=e119]
              - paragraph [ref=e120]: Today, Cash App has thousands of employees working globally across office and remote locations, with a culture geared toward innovation, collaboration and impact. We've been a distributed team since day one, and many of our roles can be done remotely from the countries where Cash App operates. No matter the location, we tailor our experience to ensure our employees are creative, productive, and happy.
              - heading "The Role" [level=3] [ref=e121]
              - paragraph [ref=e122]: At Cash App, we strive to build the best consumer financial products in the world. The Cash App Banking team aspires to make Cash App the primary place for our customers to store, manage, and move money across all their banking needs. We achieve this by providing various offerings including a range of deposit and transfer options, savings and automation tools, and a suite of benefits for Banking customers, all while ensuring a fast and reliable experience.
              - paragraph [ref=e123]
              - paragraph [ref=e124]: As a software engineer on the Cash App Banking server engineering team, you will design, develop, and deliver new banking experiences, through close collaboration across teams and disciplines. The things that you build will create significant impact at scale and will fundamentally change the consumer banking landscape as we know it today.
              - heading "You Will" [level=3] [ref=e125]
              - list [ref=e126]:
                - listitem [ref=e127]: Partner closely with your team to design, develop, test, ship, and maintain customer-facing features
                - listitem [ref=e128]: Participate in critical technical discussions and play an active role as a reviewer of design documents and code changes
                - listitem [ref=e129]: Design and implement systems to work within our microservice and event-driven architectures
                - listitem [ref=e130]: Hold your teammates and yourself to high engineering standards
                - listitem [ref=e131]: Apply an AI-first mindset using tools to improve development speed and quality, continuously experimenting with emerging approaches
              - heading "You Have" [level=3] [ref=e132]
              - list [ref=e133]:
                - listitem [ref=e134]: 5+ years of software development or equivalent experience
                - listitem [ref=e135]: Drive to find flaws in a system with many moving parts and take whatever steps are necessary to fix them
                - listitem [ref=e136]: A growth mindset and an appetite in solving open-ended and ambiguous problems
                - listitem [ref=e137]: Strong communication and collaboration skills
                - listitem [ref=e138]: Bachelor's Degree or Diploma in Computer Science, Computer Engineering, Software Engineering, or equivalent experience
              - heading "Technologies We Use and Teach" [level=3] [ref=e139]
              - list [ref=e140]:
                - listitem [ref=e141]: Java, Kotlin
                - listitem [ref=e142]: AWS
                - listitem [ref=e143]: HTTP, JSON, gRPC, Protocol Buffers
                - listitem [ref=e144]: OkHttp, Jetty, JUnit, Guice
                - listitem [ref=e145]: Hibernate, MySQL, DynamoDB
                - listitem [ref=e146]: Kafka, events, microservices
                - listitem [ref=e147]: DataDog, Prometheus, SignalFx
              - paragraph [ref=e148]:
                - text: We’re working to build a more inclusive economy where our customers have equal access to opportunity, and we strive to live by these same values in building our workplace. Block is an equal opportunity employer evaluating all employees and job applicants without regard to identity or any legally protected class. We will consider qualified applicants with arrest or conviction records for employment in accordance with state and local laws and “fair chance” ordinances. We believe in being fair, and are committed to an inclusive interview experience, including providing reasonable accommodations to disabled applicants throughout the recruitment process. We encourage applicants to share any needed accommodations with their recruiter, who will treat these requests as confidentially as possible.
                - strong [ref=e149]: Want to learn more about what we’re doing to build a workplace that is fair and square? Check out our
                - link "I+D page" [ref=e150] [cursor=pointer]:
                  - /url: https://block.xyz/news/inclusion
                - text: .
              - paragraph [ref=e151]: While there is no specific deadline to apply for this role, U.S. roles are typically open for an average of 55 days before being filled by a successful candidate. Please refer to the date listed at the top of this job page for when this role was first posted.
