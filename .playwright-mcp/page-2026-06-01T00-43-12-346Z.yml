      - generic [ref=e47]:
        - generic [ref=e49]:
          - generic [ref=e50]:
            - paragraph [ref=e51]:
              - strong [ref=e53]: Who we are
            - paragraph [ref=e54]: "Samsara (NYSE: IOT) is the pioneer of the Connected Operations™ Cloud, which is a platform that enables organizations that depend on physical operations to harness Internet of Things (IoT) data to develop actionable insights and improve their operations. At Samsara, we are helping improve the safety, efficiency and sustainability of the physical operations that power our global economy. Representing more than 40% of global GDP, these industries are the infrastructure of our planet, including agriculture, construction, field services, transportation, and manufacturing — and we are excited to help digitally transform their operations at scale."
            - paragraph [ref=e55]: Working at Samsara means you’ll help define the future of physical operations and be on a team that’s shaping an exciting array of product solutions, including Video-Based Safety, Vehicle Telematics, Apps and Driver Workflows, and Equipment Monitoring. As part of a recently public company, you’ll have the autonomy and support to make an impact as we build for the long term.
          - paragraph [ref=e56]:
            - strong [ref=e57]: "About the role:"
          - paragraph [ref=e58]: Samsara’s Revenue Operations AI & Data Team is building the future of how we go to market — with intelligence, personalization, and speed. We’re a high-impact team of builders, scientists, and strategists focused on transforming sales operations through AI. Our mission is to help sellers reach the right customer at the right time with the right message — and to put everything they need at their fingertips, whether that’s data from Salesforce, context from a past call, or content that wins deals.
          - paragraph [ref=e59]: As a Software Engineer II, AI Platform, you’ll help implement the design and contribute to the development of core platform capabilities that power Samsara’s next generation of AI-driven experiences. You’ll focus on supporting senior ICs on the team by building scalable, reliable systems that enable multi-step AI workflows, model execution, and integrations across products, rather than individual features. This role sits at the intersection of distributed systems and applied AI, where correctness, extensibility, and operational excellence matter as much as speed.
          - paragraph [ref=e60]: You’ll partner closely with Senior ICs, AI engineers, and cross-functional teams to shape shared execution patterns, define platform contracts, and evolve the foundations that support S+Engine and future AI use cases. You’ll be empowered to make architectural decisions, move fast on early iterations, and help turn emerging AI capabilities into a durable, production-grade platform that other teams can build on with confidence.
          - paragraph [ref=e61]:
            - strong [ref=e62]: This is a remote position open to candidates residing in the US except the San Francisco Bay Metro Area, NYC Metro Area, and Washington, D.C. Metro Area.
          - paragraph [ref=e63]:
            - strong [ref=e64]: "You should apply if:"
          - list [ref=e65]:
            - listitem [ref=e66]: "You want to impact the industries that run our world: Your efforts will result in real-world impact—helping to keep the lights on, get food into grocery stores, reduce emissions, and most importantly, ensure workers return home safely."
            - listitem [ref=e67]: "You are the architect of your own career: If you put in the work, this role won’t be your last at Samsara. We set up our employees for success and have built a culture that encourages rapid career development, countless opportunities to experiment and master your craft in a hyper growth environment."
            - listitem [ref=e68]: "You’re energized by our opportunity: The vision we have to digitize large sectors of the global economy requires your full focus and best efforts to bring forth creative, ambitious ideas for our customers."
            - listitem [ref=e69]: "You want to be with the best: At Samsara, we win together, celebrate together and support each other. You will be surrounded by a high-calibre team that will encourage you to do your best."
          - paragraph [ref=e70]:
            - strong [ref=e71]: "In this role, you will:"
          - list [ref=e72]:
            - listitem [ref=e73]:
              - text: Build and evolve
              - strong [ref=e74]: core AI platform capabilities
              - text: that enable teams to develop, run, and scale GenAI-powered applications across Samsara.
            - listitem [ref=e75]:
              - text: Design and implement
              - strong [ref=e76]: shared execution patterns, APIs, and services
              - text: that support multi-step AI workflows and system integrations.
            - listitem [ref=e77]:
              - text: Develop
              - strong [ref=e78]: reliable, extensible backend systems
              - text: that power AI-driven experiences used across the sales funnel and beyond.
            - listitem [ref=e79]:
              - text: Work hands-on across the stack, from
              - strong [ref=e80]: backend services and execution infrastructure
              - text: to integration with AI models and tooling.
            - listitem [ref=e81]:
              - text: Collaborate closely with
              - strong [ref=e82]: AI engineers, data scientists, product partners, and sales operators
              - text: to turn emerging AI use cases into production-ready platform capabilities.
          - paragraph [ref=e83]:
            - strong [ref=e84]: "Minimum requirements for the role:"
          - list [ref=e85]:
            - listitem [ref=e86]:
              - strong [ref=e87]: 3+ years of professional software engineering experience (excluding internships/contract roles)
              - text: ", with a strong emphasis on building and operating large-scale, production backend or platform systems."
            - listitem [ref=e88]:
              - strong [ref=e89]: Hands-on experience building and operating GenAI-powered systems in production
              - text: ", including integration with large language models (LLMs) or similar AI services."
            - listitem [ref=e90]:
              - strong [ref=e91]: Experience implementing GenAI workflows
              - text: such as prompt orchestration, tool execution, routing, or multi-step reasoning pipelines.
            - listitem [ref=e92]: High proficiency in backend programming languages (e.g., Python, Java, Go, or similar) and experience building reliable services with clear input/output schemas.
            - listitem [ref=e93]: Expert in Python and substantial knowledge on different GenAI frameworks (e.g., LangChain, OpenAI SDK, MCP, etc.)
            - listitem [ref=e94]: Familiarity with GenAI quality and safety considerations, such as validation of model outputs, structured responses, retries/fallbacks, and basic evaluation or monitoring approaches.
            - listitem [ref=e95]: Strong product sense and ability to work in fast-paced, cross-functional environments.
            - listitem [ref=e96]: Located in and authorized to work in the United States (this is a fully remote role).
          - paragraph [ref=e97]:
            - strong [ref=e98]: "An ideal candidate also has:"
          - list [ref=e99]:
            - listitem [ref=e100]: Experience working on AI products in a sales, go-to-market, or revenue operations context.
            - listitem [ref=e101]: Familiarity with enterprise tools like Salesforce, Gong, Outreach, or similar CRM/enablement platforms.
            - listitem [ref=e102]: Experience integrating with vector databases, retrieval systems, or streaming voice/chat pipelines.
            - listitem [ref=e103]: A track record of leading major technical initiatives or mentoring engineers in high-growth teams.
            - listitem [ref=e104]: Exposure to infrastructure considerations such as cost optimization, model evaluation, observability, and latency management.
          - generic [ref=e106]:
            - paragraph [ref=e108]: The range of annual base salary for full-time employees for this position is below. Please note that base pay offered may vary depending on factors including your city of residence, job-related knowledge, skills, and experience. Learn more about our total rewards and benefits below.
            - generic [ref=e109]: Annual Base Salary
            - generic [ref=e110]: $113,645—$171,900 USD
          - generic [ref=e111]:
            - paragraph [ref=e112]:
              - strong [ref=e113]: Total Rewards
            - paragraph [ref=e114]:
              - text: At Samsara, we build for the people who keep the global economy moving. We want owners, not passengers, which is why
              - link "our rewards" [ref=e115] [cursor=pointer]:
                - /url: https://www.samsara.com/company/careers/benefits
              - text: are designed to fuel high-impact builders. Our compensation program delivers above-market total compensation through a combination of base salary, performance-based bonus/variable pay, and equity (for eligible roles) in a high-growth public company. We meaningfully differentiate pay for our top performers, who have the opportunity to earn above-market compensation that can outpace the broader market over time.
            - paragraph [ref=e116]: "Beyond compensation, we provide the foundations that enable long-term success: a flexible, employee-led remote model, a professional development stipend, comprehensive health and parental leave plans, and more. If you’re ready to build for the long term and own the outcome, your journey starts here."
            - paragraph [ref=e117]:
              - strong [ref=e118]: Flexible Working
            - paragraph [ref=e119]: At Samsara, we embrace a flexible working model that caters to the diverse needs of our teams. Our offices are open for those who prefer to work in-person and we also support remote work where it aligns with our operational requirements. For certain positions, being close to one of our offices or within a specific geographic area is important to facilitate collaboration, access to resources, or alignment with our service regions. In these cases, the job description will clearly indicate any working location requirements. Our goal is to ensure that all members of our team can contribute effectively, whether they are working on-site, in a hybrid model, or fully remotely. All offers of employment are contingent upon an individual’s ability to secure and maintain the legal right to work at the company and in the specified work location, if applicable.
            - paragraph [ref=e120]:
              - strong [ref=e121]: Belonging at Samsara
            - paragraph [ref=e122]: At Samsara, we welcome everyone regardless of their background. All qualified applicants will receive consideration for employment without regard to race, color, religion, national origin, sex, gender, gender identity, sexual orientation, protected veteran status, disability, age, and other characteristics protected by law. We depend on the unique approaches of our team members to help us solve complex problems and want to ensure that Samsara is a place where people from all backgrounds can make an impact.
            - paragraph [ref=e123]:
              - strong [ref=e124]: Accommodations
            - paragraph [ref=e125]:
              - text: Samsara is an inclusive work environment, and we are committed to ensuring equal opportunity in employment for qualified persons with disabilities. Please email
              - link "accessibleinterviewing@samsara.com" [ref=e126] [cursor=pointer]:
                - /url: mailto:accessibleinterviewing@samsara.com
              - text: or
              - link "click here" [ref=e127] [cursor=pointer]:
                - /url: https://forms.gle/DrM6DFQUiSgfPtCVA
              - text: if you require any reasonable accommodations throughout the recruiting process.
            - paragraph [ref=e128]:
              - strong [ref=e129]: Our Commitment to Authenticity
            - paragraph [ref=e130]:
              - text: We use
              - link "Tofu" [ref=e131] [cursor=pointer]:
                - /url: https://hiretofu.com/privacyPolicy
              - text: ", a fraud detection tool, to validate the authenticity of applications and protect against identity fraud. This ensures we are connecting with real people and allows us to prioritize genuine candidates. Please see Samsara’s"
              - link "Candidate Privacy Notice" [ref=e132] [cursor=pointer]:
                - /url: https://www.samsara.com/legal/candidate-privacy-notice
              - text: for more information.
            - paragraph [ref=e133]:
              - strong [ref=e134]: Fraudulent Employment Offers
            - paragraph [ref=e135]:
              - text: Samsara is aware of scams involving fake job interviews and offers. Please know we do not charge fees to applicants at any stage of the hiring process. Official communication about your application will only come from emails ending in @samsara.com, @us-greenhouse-mail.io or @mail3.guide.co. For more information regarding fraudulent employment offers, please visit our
              - link "blog post here" [ref=e136] [cursor=pointer]:
                - /url: https://samsara.com/blog/avoiding-fake-job-offers
              - text: .
