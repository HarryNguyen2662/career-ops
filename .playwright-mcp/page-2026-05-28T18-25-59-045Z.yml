        - generic [ref=e18]:
          - paragraph [ref=e19]: We’re in an unbelievably exciting area of tech and are fundamentally reshaping the data storage industry. Here, you lead with innovative thinking, grow along with us, and join the smartest team in the industry.
          - paragraph [ref=e20]: This type of work—work that changes the world—is what the tech industry was founded on. So, if you're ready to seize the endless opportunities and leave your mark, come join us.
        - generic [ref=e21]:
          - paragraph [ref=e22]:
            - strong [ref=e23]: THE ROLE
          - paragraph [ref=e24]: As a Software Engineer Grad, you will be part of a team that's building the future of data storage and management. You’ll apply your foundational knowledge to tackle challenging, real-world problems from low-level hardware to large-scale cloud systems. This role is a unique opportunity to directly contribute to mission-critical features that ensure our customers have a seamless, high-performance, and reliable data experience.
          - paragraph [ref=e25]:
            - strong [ref=e26]: WHAT YOU'LL DO
          - list [ref=e27]:
            - listitem [ref=e28]:
              - strong [ref=e29]: "Contribute to core product development:"
              - text: Take ownership of key tasks within the software development lifecycle, from ideation and design to implementation and testing.
            - listitem [ref=e30]:
              - strong [ref=e31]: "Innovate and solve complex problems:"
              - text: Research and develop solutions for challenges related to data efficiency, such as optimizing data deduplication and reclamation, or improving replication across wide-area networks.
            - listitem [ref=e32]:
              - strong [ref=e33]: "Enhance system performance and scalability:"
              - text: Work on projects that improve the performance of our software, ensuring it scales effectively with ever-increasing data volumes and hardware capabilities.
            - listitem [ref=e34]:
              - strong [ref=e35]: "Collaborate across teams:"
              - text: Partner with senior engineers and cross-functional teams to integrate new features and maintain a high standard of code quality through extensive automated testing.
            - listitem [ref=e36]: We are primarily an in-office environment and therefore, you will be expected to work from the Santa Clara, CA office in compliance with Everpure's policies, unless you are on PTO, or work travel, or other approved leave
          - paragraph [ref=e37]:
            - strong [ref=e38]: WHAT YOU BRING
          - list [ref=e39]:
            - listitem [ref=e40]:
              - strong [ref=e41]: "Strong computer science fundamentals:"
              - text: A solid understanding of data structures, algorithms, concurrency, and design principles. You can apply these concepts to solve practical engineering problems.
            - listitem [ref=e42]:
              - strong [ref=e43]: "Proficiency in C++:"
              - text: You're comfortable writing clean, efficient, and well-structured code in C++.
            - listitem [ref=e44]:
              - strong [ref=e45]: "Problem-solving aptitude:"
              - text: A proactive and self-motivated approach to identifying and solving complex problems with a focus on delivering high-quality, impactful results.
            - listitem [ref=e46]:
              - strong [ref=e47]: "Collaboration and communication skills:"
              - text: The ability to articulate complex technical ideas clearly and work effectively in a team-based, open office environment.
          - paragraph [ref=e48]: "#LI-ONSITE"
