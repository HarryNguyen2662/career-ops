              - paragraph [ref=e109]: "Microsoft Federal delivers a single unified organization centered around our customer. This organization is a first-of-its-kind for Microsoft, bringing together expertise, knowledge, and insights across our teams. All critical customer functions are brought under the same organizational umbrella, bringing the breadth and depth of our expertise into laser focus on serving the U.S. Federal Government. We are committed to empowering our teams, building upon our strategic investments, and delivering the technology to achieve federal missions. As our customers pursue their work, from defending the nation, to serving its people in challenging times, they look to Microsoft to help them innovate, and they expect end-to-end engagement tailored to their needs. We aspire to... · Deliver the best technology to enable mission-critical work · Support fast-paced innovation with the U.S Federal Government · Drive focused, thoughtful, end-to-end delivery tailored to unique customer needs · Continuously advance security processes within our long-standing engagement approach · Develop products with inclusivity and accessibility at the core What Joining The Microsoft Team Means Microsoft is on a mission to empower every person and every organization on the planet to achieve more, and security, data protection, and privacy are vital pillars in our mission. Our culture is centered on embracing a growth mindset, a theme of inspiring excellence, and encouraging our diverse teams and leaders to bring their best each day. In doing so, we create life-changing innovations that impact billions of lives around the world. You can help us to achieve our mission. Microsoft continues to invest over $20B over the next 5 years in cybersecurity, including providing our customers with services and solutions that integrate across the ecosystem by connecting all your identities, endpoints, apps, emails, docs and clouds to help you close critical gaps in coverage, reduce risk, and save costs with a streamlined security portfolio. Customer Success: Microsoft aspires to help our customers achieve their own digital transformation, leveraging the power of Microsoft Cloud solutions and support offerings. To this end, Microsoft invests in a dedicated Customer Success team that will help Microsoft customers successfully realize their business outcomes. Security Solution Area: Microsoft aspires to help our customers achieve their secure digital transformation, leveraging the power of Microsoft Cloud security solutions and support offerings. We are looking for a highly motivated and passionate Cloud Solution Architect - Cybersecurity (Identity) with a focus on Identity and Access Management (IAM) to drive customer transformation on the Microsoft Cloud platform. This is a customer-facing technical role responsible for leading Identity engagements, owning the technical relationship with customers, and delivering secure Identity architectures that enable Zero Trust and mission success. Responsibilities Microsoft Federal is looking for individuals passionate about driving security solutions and outcomes that enable mission-critical work for the U.S. Federal Government. The speed of technology is fast; the speed of security is even faster – candidates must be interested in maintaining technical expertise supported by many skilling resources provided by Microsoft to invest in your growth. Ideal candidates for this role will meet the following. Identity Architecture &amp; Delivery · Lead Identity and Access Management (IAM) engagements, serving as the primary technical authority for Identity solutions · Lead the administration, maintenance, and troubleshooting of enterprise identity systems, including: o Microsoft Active Directory o Microsoft Identity Manager (MIM/FIM) o Active Directory Federation Services (AD FS) · Assist with hybrid identity and modernization initiatives involving: o Active Directory and Microsoft Entra ID integration o MFA and Conditional Access implementations o Privileged access management concepts like least privilege · Apply Zero Trust principles to Identity and Access Management operations · Identity and remediate identity-related security risks and operational issues · Support compliance, audit and security review activities related to identity systems · Collaborate with: o Security, Apps, and Infrastructure Microsoft partners o Account teams and engineering · Act as Voice of the Customer, providing feedback to influence product direction and remove blockers · Build technical credibility and trusted advisor relationships with customers Travel is an integral part of this position. You should be willing to travel as is demanded by the needs of our customers and our business. This position requires approximately 25% overnight travel if you reside or are willing to relocate within commuting distance to the work. This position may require up to 75% overnight travel if you are not within commuting distance to work. Qualifications Required Qualifications Bachelor's Degree in Computer Science, Information Technology, Engineering, Business, Liberal Arts, or related field AND 2+ years experience in cloud/infrastructure technologies, information technology (IT) consulting/support, systems administration, network operations, software development/support, technology solutions, practice development, architecture, and/or consulting OR equivalent experience. Other Requirements Security Clearance Requirements: Candidates must be able to meet Microsoft, customer and/or government security screening requirements are required for this role. These requirements include, but are not limited to the following specialized security screenings: • The successful candidate must have an active U.S. Government Top Secret Clearance with access to Sensitive Compartmented Information (SCI) based on a Single Scope Background Investigation (SSBI) with Polygraph. Ability to meet Microsoft, customer and/or government security screening requirements are required pre-offer and post-hire for this role. Failure to maintain or obtain the appropriate U.S. Government clearance and/or customer screening requirements may result in employment action up to and including termination. • Clearance Verification: This position requires successful verification of the stated security clearance to meet federal government customer requirements. You will be asked to provide clearance verification information prior to an offer of employment. • Microsoft Cloud Background Check: This position will be required to pass the Microsoft Cloud background check upon hire/transfer and every two years thereafter. • Citizenship &amp; Citizenship Verification: This position requires verification of U.S. citizenship due to citizenship-based legal restrictions. Specifically, this position supports United States federal, state, and/or local United States government agency customer and is subject to certain citizenship-based restrictions where required or permitted by applicable law. To meet this legal requirement, citizenship will be verified via a valid passport, or other approved documents, or verified US government Clearance Preferred Qualifications Bachelor’s Degree in Computer Science, Information Technology, Engineering, Business, Liberal Arts, or related field AND 3+ years experience in cloud/infrastructure technologies, information technology (IT) consulting/support, systems administration, network operations, software development/support, technology solutions, practice development, architecture, and/or consulting OR equivalent experience. Experience designing or implementing: On-premises identity technologies, including: o Microsoft Active Directory Domain Services (AD DS) o Group Policy administration o Active Directory Federation Services (AD FS) o Microsoft Identity Manager (MIM) o Public Key Infrastructure (PKI) Experience supporting identity operations in regulated, disconnected, or highly secure environments is preferred. Exposure to modern identity and security concepts, including: o Microsoft Entra ID o Hybrid identity (Active Directory + Entra ID) o Multi-factor authentication (MFA) o Conditional Access o Privileged Identity Management (PIM) Understanding of Zero Trust security principles, including: o Identity as a security control plane o Least privilege access o Strong authentication and continuous verification Exposure to: o Identity Governance and access reviews o Role-based access control (RBAC) o Application and Workload Identities Demonstrated interest in growing technical expertise in modern identity security technologies, including Microsoft Entra and cloud-based identity architectures. Familiarity with U.S. Federal identity and security requirements (e.g., ICAM, E-ICAM, Zero Trust guidance) Microsoft Certifications Preferred: o SC-300: Identity and Access Administrator o SC-100: Cybersecurity Architect Cloud Solution Architecture IC3 - The typical base pay range for this role across the U.S. is USD $86,100 - $169,800 per year. There is a different range applicable to specific work locations, within the San Francisco Bay area and New York City metropolitan area, and the base pay range for this role in those locations is USD $113,300 - $187,400 per year. Certain roles may be eligible for benefits and other compensation. Find additional benefits and pay information here: https://careers.microsoft.com/us/en/us-corporate-pay This position will be open for a minimum of 5 days, with applications accepted on an ongoing basis until the position is filled. Microsoft is an equal opportunity employer. All qualified applicants will receive consideration for employment without regard to age, ancestry, citizenship, color, family or medical care leave, gender identity or expression, genetic information, immigration status, marital status, medical condition, national origin, physical or mental disability, political affiliation, protected veteran or military status, race, ethnicity, religion, sex (including pregnancy), sexual orientation, or any other characteristic protected by applicable local laws, regulations and ordinances. If you need assistance with religious accommodations and/or a reasonable accommodation due to a disability during the application process, read more about requesting accommodations."
