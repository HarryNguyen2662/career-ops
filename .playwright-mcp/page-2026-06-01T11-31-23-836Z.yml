            - generic [ref=e60]:
              - paragraph [ref=e61]: Are you ready to take the first steps into your career and put your talents to work in the real world? Do you want to play a vital part in the business success of a high-tech global leader? Would you like to experience an inspiring world class program? If so, then the Microsoft Aspire Experience is for you.
