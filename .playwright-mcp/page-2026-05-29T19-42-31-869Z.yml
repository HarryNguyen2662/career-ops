            - heading "About Artie" [level=1] [ref=e41]:
              - strong [ref=e42]: About Artie
            - paragraph [ref=e43]: Artie is a real-time streaming platform that moves production data across systems in real time, with zero maintenance. We make high-volume data replication simple, reliable, and scalable for engineering teams.
            - paragraph [ref=e44]: Our platform powers mission-critical use cases including fraud and risk monitoring, inventory visibility, customer-facing analytics, and AI workloads. Artie is built for engineers who care about performance, reliability, and operational simplicity — and we’re growing fast.‍
            - paragraph [ref=e45]: We’re trusted by teams like ClickUp, Substack, and Alloy, and backed by top-tier investors including Y Combinator, General Catalyst, Pathlight Ventures, and the founders of Dropbox and Mode.
            - heading "‍About the Role" [level=1] [ref=e46]
            - paragraph [ref=e47]: We are a small team based in San Francisco looking to hire an engineer that has a dedicated focus around distributed systems. As an engineer, you will have the opportunity to wear multiple hats, directly interact with our customers and play a crucial role in shaping the future of our product.
            - paragraph [ref=e48]: ‍
            - paragraph [ref=e49]: This is a challenging and dynamic role and you will be working at the forefront of data engineering, distributed systems and infrastructure.
            - paragraph [ref=e50]: ‍
            - paragraph [ref=e51]: "What you should expect & examples of day-to-day tasks:"
            - list [ref=e52]:
              - listitem [ref=e53]:
                - paragraph [ref=e54]: Building column encryption, launching our analytics portal and schema change alerts.
              - listitem [ref=e55]:
                - paragraph [ref=e56]: Building tooling to streamline and automate infrastructure workloads.
              - listitem [ref=e57]:
                - paragraph [ref=e58]: Introducing pipeline efficiencies by making tradeoffs between virtual memory and disk.
              - listitem [ref=e59]:
                - paragraph [ref=e60]: Building native change data capture (CDC) connectors to data sources that we do not yet support.
            - paragraph [ref=e61]: ‍
            - heading "What we are looking for" [level=1] [ref=e62]
            - list [ref=e63]:
              - listitem [ref=e64]:
                - paragraph [ref=e65]: Strong fundamentals in computer science
              - listitem [ref=e66]:
                - paragraph [ref=e67]: Pragmatic and care more about building the right thing vs. being right
              - listitem [ref=e68]:
                - paragraph [ref=e69]: Comfortable jumping around the stack and wearing different hats
              - listitem [ref=e70]:
                - paragraph [ref=e71]: Someone that wants to take an active role in defining the next gen data platform that utilizes stream processing and CDC to drive data latency to zero, while also focusing on ease-of-use and extensibility
              - listitem [ref=e72]:
                - paragraph [ref=e73]: Past experience working on scaling async systems and exposure to topics like gRPC, Kafka, Kubernetes, Helm is preferred but not required.
              - listitem [ref=e74]:
                - paragraph [ref=e75]: Proficiency writing in Go is preferred, but not necessary.
              - listitem [ref=e76]:
                - paragraph [ref=e77]: Happy to work in-person 5 days/week in San Francisco’s Financial District with the rest of the team.
            - paragraph [ref=e78]: ‍
