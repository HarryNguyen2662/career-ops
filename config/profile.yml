cv:
  output_format: "latex" # "html" (default) or "latex"
  # LaTeX rules (enforced on every generate):
  #   - En-dash: use -- not —
  #   - Abbreviate: K8s not Kubernetes, IaC not Infrastructure-as-Code
  #   - Tech tags: max 6 per \resumeProjectHeading line
  #   - Last skills row: always \resumeSkillHeading{AI Dev Tools}{Claude Code, GitHub Copilot, Codex, Cursor}
  #   - Do NOT include \input{glyphtounicode} or \pdfgentounicode=1 (breaks tectonic)
  latex_threshold_score: 3.0  # Generate LaTeX CV for any score >= this

pipeline:
  apply_policy: "apply_all"  # Apply to all scored >= threshold; warn red flags but never block
  # Red flags: note but do not skip
  #   - "no sponsorship" visa language → note, still apply
  #   - graduation year mismatch (JD wants 2025/2026, Harry is 2027) → disclose proactively
  #   - YOE requirement exceeded → note, frame production ownership as substitute
  #   - comp below $140K floor → note, suggest asking recruiter

